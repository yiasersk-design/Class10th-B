<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Madhyamik Bengali — Exam Chapter Stories</title>
  <!-- Google Fonts & Material Symbols for Audio Player UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <style>
    :root {
      --bg-body: #f8fafc;
      --bg-header: rgba(255, 255, 255, 0.94);
      --bg-card: #ffffff;
      --bg-subtle: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      
            --primary: #ff0000;
      --primary-light: #fee2e2;
      --primary-text: #cc0000;
      
      --badge-video-bg: #fef2f2;
      --badge-video-text: #dc2626;
      --badge-video-border: #fecaca;

      
      --badge-audio-bg: #faf5ff;
      --badge-audio-text: #7e22ce;
      --badge-audio-border: #e9d5ff;
      
      --badge-cartoon-bg: #fffbeb;
      --badge-cartoon-text: #b45309;
      --badge-cartoon-border: #fde68a;
      
      --badge-realistic-bg: #ecfdf5;
      --badge-realistic-text: #047857;
      --badge-realistic-border: #a7f3d0;
      
      --badge-totopia-bg: #fff1f2;
      --badge-totopia-text: #be123c;
      --badge-totopia-border: #fecdd3;

            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
      --card-shadow-active: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 10px;
      --radius-pill: 9999px;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }


    @media (prefers-color-scheme: dark) {
      :root {
        --bg-body: #0b0f19;
        --bg-header: rgba(15, 23, 42, 0.94);
        --bg-card: #151d2e;
        --bg-subtle: #1e293b;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border-color: #273549;

        --primary: #3b82f6;
        --primary-light: #1e3a8a;
        --primary-text: #93c5fd;

        --badge-video-bg: #172554;
        --badge-video-text: #93c5fd;
        --badge-video-border: #1e40af;

        --badge-audio-bg: #2e1065;
        --badge-audio-text: #d8b4fe;
        --badge-audio-border: #581c87;

        --badge-cartoon-bg: #451a03;
        --badge-cartoon-text: #fde68a;
        --badge-cartoon-border: #78350f;

        --badge-realistic-bg: #064e3b;
        --badge-realistic-text: #a7f3d0;
        --badge-realistic-border: #065f46;

        --badge-totopia-bg: #4c0519;
        --badge-totopia-text: #fecdd3;
        --badge-totopia-border: #881337;

        --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Bengali", "Kalpurush", sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 0;
    }

    .app-container {
      max-width: 640px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Sticky Header - YouTube Mobile Style */
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 8px 12px 6px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 44px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .brand-icon {
      width: 30px;
      height: 22px;
      color: #ff0000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-icon svg {
      width: 100%;
      height: 100%;
    }

    .header-titles {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .header-titles h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .header-titles h1 span {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-left: 2px;
    }

    .yt-top-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--text-main);
    }

    .yt-icon-btn {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .yt-icon-btn svg {
      width: 22px;
      height: 22px;
    }

        /* Search & Filter Container */
    .control-panel {
      margin-top: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }


    .search-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 42px;
      padding: 0 40px 0 38px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 0.92rem;
      color: var(--text-main);
      outline: none;
      transition: var(--transition);
      font-family: inherit;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15);
    }

    .clear-search-btn {
      position: absolute;
      right: 10px;
      background: transparent;
      border: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      cursor: pointer;
    }

    .clear-search-btn svg {
      width: 16px;
      height: 16px;
    }

        /* Horizontal Filter Pills - YouTube Chip Row */
    .filters-scroll-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 0;
    }


    .explore-btn {
      width: 34px;
      height: 32px;
      border-radius: 6px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
    }

    .explore-btn svg {
      width: 18px;
      height: 18px;
    }

    .filters-divider {
      width: 1px;
      height: 20px;
      background: var(--border-color);
      flex-shrink: 0;
    }

    .filters-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0;
      scrollbar-width: none;
      -ms-overflow-style: none;
      flex: 1;
    }

    .filters-scroll::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--bg-subtle);
      border: 1px solid transparent;
      color: var(--text-main);
      font-size: 0.82rem;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 3px;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease;
    }

    .filter-btn.active {
      background: var(--text-main);
      color: var(--bg-card);
    }


    /* YouTube Mobile Feed Layout */
    .content-area {
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .results-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 500;
      padding: 8px 14px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .yt-video-card {
      display: flex;
      flex-direction: column;
      background: var(--bg-card);
      text-decoration: none;
      color: inherit;
    }

    .resource-thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background-color: #000000;
      border: 1px solid var(--border-color);
      cursor: pointer;
    }

    .thumb-white-card {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
      background-color: #ffffff;
      box-sizing: border-box;
    }

    .thumb-card-tag {
      font-size: 0.75rem;
      font-weight: 600;
      color: #cc0000;
      background: #fee2e2;
      padding: 2px 10px;
      border-radius: 9999px;
      margin-bottom: 8px;
    }

    .thumb-card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .thumb-card-subtitle {
      font-size: 0.8rem;
      color: #64748b;
      margin-bottom: 10px;
    }

                    .thumb-card-play {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #e60000;
      color: #ffffff;
      border: 2px solid #ffffff;
      box-shadow: 
        0 0 0 2px #cc0000,
        0 4px 0 #990000,
        0 5px 0 #660000,
        0 8px 12px rgba(0, 0, 0, 0.25);
      transition: transform 0.1s cubic-bezier(0.2, 0, 0.2, 1), box-shadow 0.1s cubic-bezier(0.2, 0, 0.2, 1);
    }

    .thumb-card-play svg {
      width: 17px;
      height: 17px;
      margin-left: 2px;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.4));
    }

    .resource-thumb-wrap:hover .thumb-card-play {
      transform: translateY(-2px);
      box-shadow: 
        0 0 0 2px #cc0000,
        0 6px 0 #990000,
        0 7px 0 #660000,
        0 12px 16px rgba(0, 0, 0, 0.3);
    }

    .resource-thumb-wrap:active .thumb-card-play,
    .thumb-card-play.is-pressed {
      transform: translateY(5px) scale(0.96) !important;
      box-shadow: 
        0 0 0 2px #cc0000,
        0 0 0 #990000,
        0 1px 0 #660000,
        0 2px 4px rgba(0, 0, 0, 0.3) !important;
    }





    /* Thumbnail Inside Options Overlay */
    .thumb-picker-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      z-index: 10;
    }

    .thumb-picker-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border-color);
    }

    .thumb-picker-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .thumb-picker-close {
      background: none;
      border: none;
      font-size: 1.1rem;
      line-height: 1;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 6px;
    }

    .thumb-picker-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      flex: 1;
    }

    .thumb-picker-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
    }

    .thumb-picker-btn:hover,
    .thumb-picker-btn:active {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary-text);
    }

    .thumb-picker-btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .resource-thumb-wrap iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* Video completely covers the mobile screen ONLY in Landscape mode */
    :fullscreen,
    ::backdrop {
      background-color: #000000 !important;
    }

    @media (orientation: landscape) {
      .resource-thumb-wrap iframe:fullscreen,
      .resource-thumb-wrap iframe:-webkit-full-screen,
      .resource-thumb-wrap iframe:-moz-full-screen,
      .resource-thumb-wrap iframe:-ms-fullscreen {
        width: 100vw !important;
        height: 100vh !important;
        height: 100dvh !important;
        max-width: 100vw !important;
        max-height: 100dvh !important;
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        inset: 0 !important;
        transform: none !important;
        margin: 0 !important;
        border: 0 !important;
        background: #000000 !important;
        z-index: 2147483647 !important;
      }
    }

    /* ভার্টিক্যাল (Portrait) অবস্থায় কোনো ফুলস্ক্রিন কালো পেজ থাকবে না */
    @media (orientation: portrait) {
      .resource-thumb-wrap iframe:fullscreen,
      .resource-thumb-wrap iframe:-webkit-full-screen {
        position: static !important;
        width: 100% !important;
        height: 100% !important;
      }
    }

    /* Clean Play Icon without background shadow box */
    .yt-inline-play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: transparent;
      box-shadow: none;
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      pointer-events: none;
    }

    .yt-inline-play-btn svg {
      width: 44px;
      height: 44px;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.65));
    }

    /* Screen-matched Overlays */
    .yt-top-badges {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .yt-circle-badge {
      width: 30px;
      height: 30px;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }

    .yt-circle-badge svg {
      width: 16px;
      height: 16px;
    }

    .yt-duration-badge {
      position: absolute;
      right: 8px;
      bottom: 8px;
      background: transparent;
      border: none;
      box-shadow: none;
      color: #64748b;
      font-size: 0.70rem;
      font-weight: 600;
      line-height: 1;
      padding: 0;
    }

    .yt-video-info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 8px;
    }

    .yt-channel-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #e11d48;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.78rem;
      flex-shrink: 0;
      overflow: hidden;
    }

    .yt-video-text {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .yt-video-title {
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.2;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    .yt-video-meta {
      font-size: 0.72rem;
      color: var(--text-muted);
      line-height: 1.15;
      margin: 2px 0 0 0;
      padding: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .yt-more-btn {
      background: none;
      border: none;
      color: var(--text-main);
      width: 24px;
      height: 24px;
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .yt-more-btn svg {
      width: 18px;
      height: 18px;
    }




    /* Type Specific Badges */
    .type-video .resource-type-icon {
      background: var(--badge-video-bg);
      color: var(--badge-video-text);
      border: 1px solid var(--badge-video-border);
    }
    .type-video .action-badge {
      background: var(--badge-video-bg);
      color: var(--badge-video-text);
      border: 1px solid var(--badge-video-border);
    }

    .type-audio .resource-type-icon {
      background: var(--badge-audio-bg);
      color: var(--badge-audio-text);
      border: 1px solid var(--badge-audio-border);
    }
    .type-audio .action-badge {
      background: var(--badge-audio-bg);
      color: var(--badge-audio-text);
      border: 1px solid var(--badge-audio-border);
    }

    .type-cartoon .resource-type-icon {
      background: var(--badge-cartoon-bg);
      color: var(--badge-cartoon-text);
      border: 1px solid var(--badge-cartoon-border);
    }
    .type-cartoon .action-badge {
      background: var(--badge-cartoon-bg);
      color: var(--badge-cartoon-text);
      border: 1px solid var(--badge-cartoon-border);
    }

    .type-realistic .resource-type-icon {
      background: var(--badge-realistic-bg);
      color: var(--badge-realistic-text);
      border: 1px solid var(--badge-realistic-border);
    }
    .type-realistic .action-badge {
      background: var(--badge-realistic-bg);
      color: var(--badge-realistic-text);
      border: 1px solid var(--badge-realistic-border);
    }

    .type-totopia .resource-type-icon {
      background: var(--badge-totopia-bg);
      color: var(--badge-totopia-text);
      border: 1px solid var(--badge-totopia-border);
    }
    .type-totopia .action-badge {
      background: var(--badge-totopia-bg);
      color: var(--badge-totopia-text);
      border: 1px solid var(--badge-totopia-border);
    }

    /* Empty Search State */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      margin: 10px 0;
    }

    .empty-icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 12px;
      color: var(--text-muted);
      opacity: 0.7;
    }

    .empty-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .empty-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .reset-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: var(--radius-pill);
      cursor: pointer;
    }

    

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    /* Visual Poem Viewer Styles */
    .poem-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .poem-modal-overlay.active {
      display: flex;
    }

    .poem-modal-card {
      background: var(--bg-card);
      width: 100%;
      max-width: 580px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
      max-height: 94vh;
    }

    .poem-modal-header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-subtle);
    }

    .poem-modal-header-info h3 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 0;
    }

    .poem-modal-header-info p {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin: 2px 0 0;
    }

    .poem-modal-close-btn {
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      line-height: 1;
    }

    .poem-scene-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .poem-scene-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }

    .poem-end-frame {
      width: 100%;
      height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, #1e293b 0%, #000000 100%);
      color: #ffffff;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      user-select: none;
      text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
    }

    .poem-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.6);
      color: #ffffff;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 5;
      transition: background 0.2s ease;
    }

    .poem-nav-btn:hover {
      background: rgba(0, 0, 0, 0.9);
    }

    .poem-nav-prev {
      left: 10px;
    }

    .poem-nav-next {
      right: 10px;
    }

    .poem-nav-btn svg {
      width: 20px;
      height: 20px;
    }

    .poem-text-content {
      padding: 16px;
      overflow-y: auto;
      max-height: 210px;
      text-align: center;
      background: var(--bg-card);
    }

    .poem-stanza-text {
      font-size: 0.95rem;
      line-height: 1.8;
      color: var(--text-main);
      font-weight: 500;
      white-space: pre-line;
      margin: 0;
    }

    .poem-modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-top: 1px solid var(--border-color);
      background: var(--bg-subtle);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .poem-action-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* Voice Wave Overlay & Hidden Audio Player */
    .audio-hidden-mount {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      opacity: 0 !important;
      pointer-events: none !important;
      z-index: -1 !important;
      visibility: hidden !important;
    }

    .audio-player-wrapper {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
      overflow: hidden;
    }

    .resource-thumb-wrap:fullscreen,
    .resource-thumb-wrap:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      background: #000000 !important;
    }

    .player-container {
      background-color: #1a1c0d; 
      width: 100%;
      max-width: 450px;
      padding: 15px 24px 20px 24px;
      height: 100%;
      display: flex;
      flex-direction: column;
      color: #ffffff;
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* --- নেভিগেশন বার --- */
    .nav-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      flex-shrink: 0;
      height: 55px; 
    }

    .nav-btn {
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background 0.2s;
    }

    .back-nav-btn {
      position: relative;
      top: 0px;    
      left: -15px; 
      z-index: 10;
    }

    .back-nav-btn svg {
      width: 32px; 
      height: 32px;
    }

    .more-menu-btn {
      position: relative; 
      top: 0px;    
      left: 21px;  
      z-index: 10;
    }

    .more-menu-btn svg {
      width: 24px;
      height: 24px;
    }

    .nav-btn:active {
      background: rgba(255, 255, 255, 0.1);
    }

                    /* অ্যালবাম আর্ট বক্স সম্পূর্ণ মুছে ফেলা হয়েছে */
    .audio-speaker-center-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px 16px;
      pointer-events: none;
    }

    .audio-speaker-center-text {
      font-size: 2.3rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.3;
      letter-spacing: 0.02em;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
      user-select: none;
      -webkit-user-select: none;
    }

    /* অ্যাকশন বাটন সেকশন */
    .action-buttons {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 15px;
      padding-bottom: 2px;
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 0;
      max-height: 50px;
      opacity: 1;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .action-buttons::-webkit-scrollbar {
      display: none;
    }

    .btn {
      background-color: rgba(255, 255, 255, 0.08);
      border: none;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 25px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .divider {
      width: 1px;
      height: 18px;
      background-color: rgba(255, 255, 255, 0.2);
      margin: 0 4px;
    }

    /* প্রোগ্রেস বার */
    .progress-container {
      margin-bottom: 12px; 
      flex-shrink: 0;
      max-height: 30px;
      opacity: 1;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .progress-bar-wrapper {
      position: relative;
      height: 12px;
      display: flex;
      align-items: center;
      cursor: pointer;
      touch-action: none;
    }

    .progress-track {
      width: 100%;
      height: 3px;
      background-color: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
    }

    .progress-fill {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 0%; 
      height: 3px;
      background-color: #ffffff;
      border-radius: 2px;
      pointer-events: none;
    }

    .progress-thumb {
      position: absolute;
      left: 0%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      background-color: #ffffff;
      border-radius: 50%;
      pointer-events: none;
    }

    .time-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 4px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    /* প্লেব্যাক কন্ট্রোলস */
    .playback-controls {
      display: flex;
      align-items: center;
      justify-content: center; 
      padding: 5px 0 10px 0; 
      flex-shrink: 0;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .control-btn {
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      transform: scale(1);
      opacity: 1;
      width: 50px; 
      overflow: hidden; 
    }
    
    .control-btn.prev-btn {
      margin-right: 40px;
    }
    
    .control-btn.next-btn {
      margin-left: 40px;
    }

    .control-btn img {
      width: 30px;  
      height: 30px; 
      object-fit: contain;
      filter: brightness(0) invert(1);
    }

    .skip-wrapper {
      display: flex;
      align-items: center;
    }

    .skip-line {
      width: 3px;      
      height: 22px;      
      background-color: #ffffff;
      border-radius: 2px; 
    }

    .back-icon {
      transform: scaleX(-1);
      margin-left: -2px; 
    }

    .next-icon {
      margin-right: -2px; 
    }

    .play-spacer {
      width: 0px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .play-pause-btn {
      width: 70px;
      height: 70px;
      background-color: #ffffff;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: none;
      flex-shrink: 0;
      transition: transform 0.2s ease, background-color 0.3s ease;
      position: relative;
      z-index: 5;
    }

    .play-pause-btn:active {
      transform: scale(0.92);
    }

    .play-pause-btn svg,
    .play-pause-btn img {
      width: 34px;
      height: 34px;
      fill: #1a1c0d;
      object-fit: contain;
    }

            /* ফুলস্ক্রিন/প্লে অবস্থার স্মুথ অ্যানিমেশন - কোনো বাটন বা কন্ট্রোল অদৃশ্য হবে না */
    .player-container.fullscreen-active .action-buttons,
    .player-container.fullscreen-active .progress-container {
      opacity: 1;
      max-height: 30px;
      margin-bottom: 12px;
      pointer-events: auto;
      overflow: visible;
    }

    .player-container.fullscreen-active .prev-btn,
    .player-container.fullscreen-active .next-btn {
      width: 50px;
      padding: 10px;
      transform: scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    .player-container.fullscreen-active .prev-btn {
      margin-right: 40px;
    }

    .player-container.fullscreen-active .next-btn {
      margin-left: 40px;
    }
    
    .player-container.fullscreen-active .play-spacer {
      width: 0px;
      display: none;
    }

    .player-container.fullscreen-active .playback-controls {
      padding: 5px 0 10px 0;
      justify-content: center;
    }



    @media (max-height: 600px) {
      .nav-header { margin-bottom: 5px; }
      .album-art-container { margin-bottom: 10px; }
      .play-pause-btn { width: 55px; height: 55px; } 
      .play-pause-btn svg,
      .play-pause-btn img { width: 26px; height: 26px; } 
      .control-btn.prev-btn { margin-right: 30px; }
      .control-btn.next-btn { margin-left: 30px; }
    }

    /* T-Popup (Bottom Sheet) Styles */
    .t-popup-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom right, rgba(26, 47, 21, 0.8), rgba(16, 22, 11, 0.8), rgba(0, 0, 0, 0.8));
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .t-popup-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .t-popup-sheet {
      position: absolute;
      bottom: -100%;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 450px;
      background-color: #212121;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      z-index: 101;
      display: flex;
      flex-direction: column;
      max-height: 95%;
      transition: bottom 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      color: #ffffff;
      font-family: 'Roboto', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    .t-popup-sheet.active {
      bottom: 0;
    }

    .t-popup-header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 20px 16px 8px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .t-popup-icon-btn {
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      padding: 4px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 20px;
      transition: background-color 0.2s;
    }

    .t-popup-icon-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .t-popup-icon-filled {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .t-action-row {
      display: flex;
      justify-content: space-evenly;
      padding: 16px 8px;
    }

    .t-action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      width: 100px;
    }

    .t-action-icon-box {
      width: 100%;
      height: 60px;
      background-color: #363636;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
    }

    .t-action-item:hover .t-action-icon-box {
      background-color: #444444;
    }

    .t-action-item span {
      font-size: 13px;
      font-weight: 400;
    }

    .t-list-container {
      display: flex;
      flex-direction: column;
      padding-bottom: 8px;
      overflow-y: auto;
    }

    .t-list-container::-webkit-scrollbar {
      width: 4px;
    }

    .t-list-container::-webkit-scrollbar-thumb {
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .t-list-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .t-list-item:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .t-list-item .material-symbols-outlined {
      margin-right: 18px;
      font-size: 24px;
    }

    .t-list-item span {
      font-size: 15px;
      font-weight: 400;
    }

    /* Video Dialogue Speaker Badge — Modern Clean Glass Pill */
    .speaker-indicator-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 25;
      display: none;
      align-items: center;
      padding: 5px 14px;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.78) 0%, rgba(30, 41, 59, 0.65) 100%);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 9999px;
      box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.5), 
                  0 0 0 1px rgba(255, 255, 255, 0.08) inset;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      transform: translateY(-6px) scale(0.96);
      opacity: 0;
      transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), 
                  transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform, opacity;
    }

    .speaker-indicator-badge.visible {
      display: inline-flex;
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* টেক্সট কন্টেইনার */
    .speaker-badge-content {
      display: flex;
      align-items: baseline;
      gap: 6px;
      line-height: 1;
    }

    .speaker-label-tag {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #94a3b8;
    }

    .speaker-badge-name {
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: #f8fafc;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Top Header - YouTube Mobile Style -->
    <header class="sticky-header">
      <div class="header-top">
        <div class="brand-group">
          <div class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
          </div>
          <div class="header-titles">
            <h1>Madhyamik <span>Bengali</span></h1>
          </div>
        </div>

        <div class="yt-top-actions">
          <button class="yt-icon-btn" id="openSearchBtn" aria-label="Search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- Search & Filters -->
      <div class="control-panel">
        <div class="search-wrapper" id="searchWrapper" style="display: none;">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input 
            type="search" 
            id="searchInput" 
            class="search-input" 
            placeholder="Search chapters or topics..." 
            autocomplete="off"
            aria-label="Search Chapters"
          >
          <button id="clearSearchBtn" class="clear-search-btn" title="Clear search" aria-label="Clear Search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <!-- YouTube Chip Filter Row (With Explore Button) -->
        <div class="filters-scroll-wrapper">
          <button class="explore-btn" aria-label="Explore">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
            </svg>
          </button>
          <div class="filters-divider"></div>
          <div class="filters-scroll" role="tablist" aria-label="Filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="video">Video</button>
            <button class="filter-btn" data-filter="audio">Audio</button>
            <button class="filter-btn" data-filter="cartoon">Cartoon</button>
            <button class="filter-btn" data-filter="realistic">Realistic</button>
            <button class="filter-btn" data-filter="poem">Poem</button>
            <button class="filter-btn" data-filter="koni">কোনি</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content List -->
    <main class="content-area">
      <div class="results-meta">
        <span id="statusIndicator">দেখাচ্ছে ৭ টি অধ্যায়</span>
        <span id="resourceTotalIndicator">মোট ১৫ টি রিসোর্স</span>
      </div>

      <div id="chaptersContainer" aria-live="polite">
        <!-- Rendered via JavaScript -->
      </div>

      <!-- No Results State -->
      <div id="emptyState" class="empty-state" style="display: none;">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
        <h2 class="empty-title">কোনো অধ্যায় বা রিসোর্স পাওয়া যায়নি</h2>
        <p class="empty-desc">অনুগ্রহ করে অন্য শব্দ দিয়ে খুঁজুন অথবা ফিল্টার রিসেট করুন।</p>
        <button id="resetFilterBtn" class="reset-btn">ফিল্টার রিসেট করুন</button>
      </div>
    </main>

    <!-- Interactive Visual Poem Modal Viewer -->
    <div id="poemModal" class="poem-modal-overlay" onclick="closePoemModal(event)">
      <div class="poem-modal-card" onclick="event.stopPropagation()">
        <div class="poem-modal-header">
          <div class="poem-modal-header-info">
            <h3 id="poemModalTitle">কবিতা</h3>
            <p id="poemModalSubtitle"></p>
          </div>
          <button class="poem-modal-close-btn" onclick="closePoemModal()" title="বন্ধ করুন">✕</button>
        </div>

        <div class="poem-scene-wrapper" id="poemSwipeArea">

    function getYoutubeVideoId(url) {
      try {
        const urlObj = new URL(url);
        if (urlObj.hostname.includes('youtu.be')) {
          return urlObj.pathname.slice(1).split('?')[0];
        } else if (urlObj.searchParams.has('v')) {
          return urlObj.searchParams.get('v');
        }
        return '';
      } catch (e) {
        return '';
      }
    }

        const t = urlObj.searchParams.get('t') || urlObj.searchParams.get('start');
        return t ? parseInt(t, 10) : 0;
      } catch (e) {
        return 0;
      }
    }

    // YouTube End Time Extractor Helper
    function getYoutubeEndTime(url) {
      try {
        const urlObj = new URL(url);
        const end = urlObj.searchParams.get('end');
        return end ? parseInt(end, 10) : 0;
      } catch (e) {
        return 0;
      }
    }

    // YouTube Thumbnail Generator Helper
    function getYoutubeThumbnailUrl(url) {
      const videoId = getYoutubeVideoId(url);
      return videoId ? `https://img.youtube.com/vi/${videoId}/mqdefault.jpg` : '';
    }

    // Track currently playing video container and YouTube API player instance
    let currentActiveContainer = null;

    // Load YouTube IFrame API script automatically if not present
    if (!window.YT) {
      const tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      const firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    }

    // Helper to open options list directly inside the thumbnail
    function openChapterOptions(container, chapterIndex) {

    // Helper to format time into M:SS (matching reference music player)
    function formatMediaTime(seconds) {
      if (!seconds || isNaN(seconds) || seconds < 0) seconds = 0;
      const totalSec = Math.floor(seconds);
      const hrs = Math.floor(totalSec / 3600);
      const mins = Math.floor((totalSec % 3600) / 60);
      const secs = totalSec % 60;
      const sStr = secs < 10 ? '0' + secs : String(secs);
      if (hrs > 0) {
        const mStr = mins < 10 ? '0' + mins : String(mins);
        return `${hrs}:${mStr}:${sStr}`;
      }
      return `${mins}:${sStr}`;
    }

    function getAudioPlayerHTML() {

    // Function to play video/audio instantly on click with dynamic timeline, seekbar, controls, and Voice Wave logic
    function playInlineVideo(container, videoId, startTime = 0, endTime = 0, skipRanges = [], isAudio = false, dialogues = []) {
      if (!videoId) return;

      // If this video is already playing, do nothing
      if (currentActiveContainer === container) return;

      // Stop previous player instance, clear timers, and restore its thumbnail
      if (currentActiveContainer && currentActiveContainer !== container && currentActiveContainer.isConnected) {
        if (currentActiveContainer._timeCheckTimer) {
          clearInterval(currentActiveContainer._timeCheckTimer);
          currentActiveContainer._timeCheckTimer = null;
        }
        if (currentActiveContainer._autoHideTimelineTimer) {
          clearTimeout(currentActiveContainer._autoHideTimelineTimer);
          currentActiveContainer._autoHideTimelineTimer = null;
        }
        if (currentYTPlayer && typeof currentYTPlayer.destroy === 'function') {
          try { currentYTPlayer.destroy(); } catch (e) {}
          currentYTPlayer = null;
        }
        if (currentActiveContainer._originalThumbHTML) {
          currentActiveContainer.innerHTML = currentActiveContainer._originalThumbHTML;
          if (currentActiveContainer._savedOnClick) {
            currentActiveContainer.setAttribute('onclick', currentActiveContainer._savedOnClick);
          }
        }
      }

      // Save the initial thumbnail UI before inserting player
      if (!container._originalThumbHTML) {
        container._originalThumbHTML = container.innerHTML;
      }
      if (!container._savedOnClick) {
        container._savedOnClick = container.getAttribute('onclick');
      }

      container._savedVideoId = videoId;
      container._isScrubbing = false;
      container._autoHideTimelineTimer = null;
      container._isAudio = isAudio;
      currentActiveContainer = container;

      // Remove click handler from container while playing
      container.removeAttribute('onclick');

            // Create an internal mount element for YouTube Player
      const uniquePlayerId = 'yt_player_' + Math.random().toString(36).substring(2, 9);
      if (isAudio) {
        container.innerHTML = `
          <div id="${uniquePlayerId}" class="audio-hidden-mount"></div>
          ${getAudioPlayerHTML()}
        `;
        const audioWrap = container.querySelector('.audio-player-wrapper');
        if (audioWrap) audioWrap.style.display = 'none';
        initAudioScrubber();
      } else {

        container.innerHTML = `
          <div id="${uniquePlayerId}" style="width:100%;height:100%;"></div>
          <div id="speakerBadge" class="speaker-indicator-badge">
            <div class="speaker-badge-content">
              <span class="speaker-label-tag">চরিত্র:-</span>
              <span id="speakerBadgeText" class="speaker-badge-name"></span>
            </div>
          </div>
        `;
      }

      const playerVarsObj = {
        autoplay: 1,
        playsinline: 1,
        fs: 1,
        rel: 0,
        iv_load_policy: 3,
        modestbranding: 1,
        enablejsapi: 1,
        start: startTime || 0
      };

      if (endTime > 0) {
        playerVarsObj.end = endTime;
      }

      function initAudioScrubber() {
        const playerContainer = document.getElementById('playerContainer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('audioBtnPrev');
        const nextBtn = document.getElementById('audioBtnNext');
        const wrap = document.getElementById('audioProgressWrap');
        const fill = document.getElementById('audioProgressFill');
        const thumb = document.getElementById('audioProgressThumb');
        const timeCur = document.getElementById('audioTimeCurrent');
        const timeDur = document.getElementById('audioTimeDuration');

        const playContent = `<img src="https://raw.githubusercontent.com/yiasersk-design/SVG/main/play-503072-512px.webp" alt="Play">`;
        const pauseContent = `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;

        if (playPauseBtn) {
          playPauseBtn.innerHTML = pauseContent;
        }

        // স্ক্রিন ট্যাপে ফুল/মিনি কন্ট্রোল মোড পরিবর্তন
        if (playerContainer) {
          playerContainer.onclick = function(e) {
            if (e.target.closest('.play-pause-btn') || e.target.closest('.control-btn') || e.target.closest('.nav-btn') || e.target.closest('.progress-bar-wrapper')) {
              return;
            }
            if (playerContainer.classList.contains('fullscreen-active')) {
              playerContainer.classList.remove('fullscreen-active');
            } else if (currentYTPlayer && typeof currentYTPlayer.getPlayerState === 'function' && currentYTPlayer.getPlayerState() === YT.PlayerState.PLAYING) {
              playerContainer.classList.add('fullscreen-active');
            }
          };
        }

        // প্লে ও পজ বাটন ক্লিক হ্যান্ডলার
        if (playPauseBtn) {
          playPauseBtn.onclick = function(e) {
            e.stopPropagation();
            if (!currentYTPlayer || typeof currentYTPlayer.getPlayerState !== 'function') return;
            const state = currentYTPlayer.getPlayerState();
            if (state === YT.PlayerState.PLAYING) {
              currentYTPlayer.pauseVideo();
            } else {
              currentYTPlayer.playVideo();
            }
          };
        }

        // পূর্ববর্তী বাটন (১০ সেকেন্ড পিছিয়ে যাওয়া)
        if (prevBtn) {
          prevBtn.onclick = function(e) {
            e.stopPropagation();
            if (!currentYTPlayer || typeof currentYTPlayer.getCurrentTime !== 'function') return;
            const cur = currentYTPlayer.getCurrentTime();
            const minTime = startTime || 0;
            currentYTPlayer.seekTo(Math.max(minTime, cur - 10), true);
          };
        }

        // পরবর্তী বাটন (১০ সেকেন্ড এগিয়ে যাওয়া)
        if (nextBtn) {
          nextBtn.onclick = function(e) {
            e.stopPropagation();
            if (!currentYTPlayer || typeof currentYTPlayer.getCurrentTime !== 'function') return;
            const cur = currentYTPlayer.getCurrentTime();
            const maxDuration = (endTime > 0 ? endTime : currentYTPlayer.getDuration()) || (cur + 10);
            currentYTPlayer.seekTo(Math.min(maxDuration, cur + 10), true);
          };
        }

        // প্রোগ্রেস বার স্ক্রাবিং লজিক
        if (!wrap || !fill || !thumb) return;
        let isDragging = false;

        function updateFromPointer(e) {
          const rect = wrap.getBoundingClientRect();
          const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
          let ratio = (clientX - rect.left) / rect.width;
          if (ratio < 0) ratio = 0;
          if (ratio > 1) ratio = 1;

          fill.style.width = (ratio * 100) + '%';
          thumb.style.left = (ratio * 100) + '%';

          const curDuration = (endTime > 0 ? endTime : (currentYTPlayer && typeof currentYTPlayer.getDuration === 'function' ? currentYTPlayer.getDuration() : 0)) || 0;
          const segDuration = Math.max(1, curDuration - (startTime || 0));
          const seekTarget = (startTime || 0) + (ratio * segDuration);

          if (timeCur) {
            timeCur.textContent = formatMediaTime(seekTarget);
          }
          return seekTarget;
        }

        wrap.onpointerdown = function(e) {
          e.stopPropagation();
          isDragging = true;
          container._isScrubbing = true;
          try { wrap.setPointerCapture(e.pointerId); } catch (err) {}
          updateFromPointer(e);
        };

        wrap.onpointermove = function(e) {
          if (!isDragging) return;
          updateFromPointer(e);
        };

        wrap.onpointerup = function(e) {
          if (!isDragging) return;
          const seekTarget = updateFromPointer(e);
          isDragging = false;
          container._isScrubbing = false;
          try { wrap.releasePointerCapture(e.pointerId); } catch (err) {}
          if (currentYTPlayer && typeof currentYTPlayer.seekTo === 'function') {
            currentYTPlayer.seekTo(seekTarget, true);
          }
        };

        wrap.onpointercancel = function() {
          isDragging = false;
          container._isScrubbing = false;
        };
      }

      function stopAndClosePlayer() {
        stopBackgroundAudioEngine();
        if ('mediaSession' in navigator) {
          navigator.mediaSession.playbackState = 'none';
        }
        const isFS = document.fullscreenElement || 
                     document.webkitFullscreenElement || 
                     document.mozFullScreenElement || 
                     document.msFullscreenElement;
        if (isFS) {
          const exitFS = document.exitFullscreen || 
                         document.webkitExitFullscreen || 
                         document.mozCancelFullScreen || 
                         document.msExitFullscreen;
          if (exitFS) exitFS.call(document).catch(() => {});
        }
        if (container._timeCheckTimer) {
          clearInterval(container._timeCheckTimer);
          container._timeCheckTimer = null;
        }
        if (container._autoHideTimelineTimer) {
          clearTimeout(container._autoHideTimelineTimer);
          container._autoHideTimelineTimer = null;
        }
        if (currentYTPlayer && typeof currentYTPlayer.destroy === 'function') {
          try { currentYTPlayer.destroy(); } catch (e) {}
          currentYTPlayer = null;
        }
        if (container._originalThumbHTML) {
          container.innerHTML = container._originalThumbHTML;
          if (container._savedOnClick) {
            container.setAttribute('onclick', container._savedOnClick);
          }
        }
        container._stopPlayer = null;
        currentActiveContainer = null;
      }
      container._stopPlayer = stopAndClosePlayer;

      function monitorTimeline() {
        if (!currentYTPlayer || typeof currentYTPlayer.getCurrentTime !== 'function') return;
        const currentTime = currentYTPlayer.getCurrentTime();

        // Check timeline end guard
        if (endTime > 0 && currentTime >= endTime) {
          stopAndClosePlayer();
          return;
        }

        // Check and enforce skip ranges (prevents viewing or seeking into skipped intervals)
        if (Array.isArray(skipRanges) && skipRanges.length > 0) {
          for (let i = 0; i < skipRanges.length; i++) {
            const range = skipRanges[i];
            if (currentTime >= range.start && currentTime < range.end) {
              currentYTPlayer.seekTo(range.end, true);
              break;
            }
          }
        }

        // Update dialogue speaker badge overlay
        if (Array.isArray(dialogues) && dialogues.length > 0) {
          const currentDialogue = dialogues.find(d => currentTime >= d.start && currentTime <= d.end);
          if (isAudio) {
            const audioSpeakerElem = document.getElementById('audioSpeakerName');
            if (audioSpeakerElem) {
              audioSpeakerElem.textContent = currentDialogue ? currentDialogue.speaker : '';
            }
          } else {
            const badge = document.getElementById('speakerBadge');
            const badgeText = document.getElementById('speakerBadgeText');
            if (badge && badgeText) {
              if (currentDialogue) {
                badgeText.textContent = currentDialogue.speaker;
                badge.classList.add('visible');
              } else {
                badge.classList.remove('visible');
              }
            }
          }
        }

        // Update in-app audio timeline UI if not actively scrubbing
        if (isAudio && !container._isScrubbing) {
          const curDuration = (endTime > 0 ? endTime : currentYTPlayer.getDuration()) || 0;
          const segStart = startTime || 0;
          const segDuration = Math.max(1, curDuration - segStart);
          const curSegTime = Math.max(0, currentTime - segStart);
          const pct = Math.min(100, Math.max(0, (curSegTime / segDuration) * 100));

          const fill = document.getElementById('audioProgressFill');
          const thumb = document.getElementById('audioProgressThumb');
          const timeCur = document.getElementById('audioTimeCurrent');
          const timeDur = document.getElementById('audioTimeDuration');

          if (fill) fill.style.width = pct + '%';
          if (thumb) thumb.style.left = pct + '%';
          if (timeCur) timeCur.textContent = formatMediaTime(currentTime);
          if (timeDur) timeDur.textContent = formatMediaTime(curDuration);
        }
      }

      function requestFullScreenMode(element) {
        if (!element) return;
        const requestFS = element.requestFullscreen || 
                          element.webkitRequestFullscreen || 
                          element.mozRequestFullScreen || 
                          element.msRequestFullscreen;
        if (requestFS) {
          const promise = requestFS.call(element);
          if (promise && typeof promise.then === 'function') {
            promise.then(() => {
              history.pushState({ isFullscreenVideo: true }, '');
            }).catch(() => {});
          } else {
            history.pushState({ isFullscreenVideo: true }, '');
          }
        }
      }

      function launchAppropriateFullscreen() {
        const hasOverlay = isAudio || (Array.isArray(dialogues) && dialogues.length > 0);
        const targetElement = hasOverlay ? container : document.getElementById(uniquePlayerId);
        if (targetElement && !document.fullscreenElement && !document.webkitFullscreenElement) {
          requestFullScreenMode(targetElement);
        }
      }

            function createPlayer() {
        // চ্যাপ্টারের নাম সনাক্ত করা
        let chapterTitle = "Madhyamik Study";
        const parentCard = container.closest('.yt-video-card');
        if (parentCard) {
          const tElem = parentCard.querySelector('.yt-video-title');
          if (tElem) chapterTitle = tElem.textContent.trim();
        }

        currentYTPlayer = new YT.Player(uniquePlayerId, {
          width: '100%',
          height: '100%',
          videoId: videoId,
          playerVars: playerVarsObj,
          events: {
            onReady: function(event) {
              if (startTime > 0) {
                event.target.seekTo(startTime, true);
              }
              event.target.playVideo();
              if (!isAudio) {
                launchAppropriateFullscreen();
              }
            },
            onStateChange: function(event) {
              const playPauseBtn = document.getElementById('playPauseBtn');
              const playerContainer = document.getElementById('playerContainer');
              const playContent = `<img src="https://raw.githubusercontent.com/yiasersk-design/SVG/main/play-503072-512px.webp" alt="Play">`;
              const pauseContent = `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;

              if (event.data === YT.PlayerState.PLAYING) {
                container._wasPlayingBeforeLock = true;
                startBackgroundAudioEngine();
                setupMediaSession(chapterTitle, isAudio ? 'অডিও সংস্করণ' : 'ভিডিও সংস্করণ');
                if ('mediaSession' in navigator) {
                  navigator.mediaSession.playbackState = 'playing';
                }

                if (isAudio) {
                  const audioWrap = container.querySelector('.audio-player-wrapper');
                  if (audioWrap) audioWrap.style.display = 'flex';
                }
                if (playPauseBtn) playPauseBtn.innerHTML = pauseContent;
                if (playerContainer) playerContainer.classList.add('fullscreen-active');

                launchAppropriateFullscreen();
                if (!container._timeCheckTimer) {
                  container._timeCheckTimer = setInterval(monitorTimeline, 100);
                }
              } else if (event.data === YT.PlayerState.PAUSED) {
                // ইউজার যদি স্ক্রিন অন থাকা অবস্থায় ম্যানুয়ালি পজ করে থাকেন
                if (!document.hidden) {
                  container._wasPlayingBeforeLock = false;
                  stopBackgroundAudioEngine();
                  if ('mediaSession' in navigator) {
                    navigator.mediaSession.playbackState = 'paused';
                  }
                } else if (container._wasPlayingBeforeLock) {
                  // স্ক্রিন বন্ধ থাকার কারণে যদি ব্রাউজার নিজে থেকে পজ করে, তবে তাৎক্ষণিক অটো-রিজিউম
                  setTimeout(() => {
                    if (currentYTPlayer && typeof currentYTPlayer.playVideo === 'function') {
                      currentYTPlayer.playVideo();
                    }
                  }, 100);
                }

                if (playPauseBtn) playPauseBtn.innerHTML = playContent;
                if (playerContainer) playerContainer.classList.remove('fullscreen-active');

                monitorTimeline();
              } else if (event.data === YT.PlayerState.ENDED) {
                container._wasPlayingBeforeLock = false;
                stopAndClosePlayer();
              }
            }
          }
        });
      }


      if (window.YT && window.YT.Player) {
        createPlayer();
      } else {
        const checkYTReady = setInterval(() => {
          if (window.YT && window.YT.Player) {
            clearInterval(checkYTReady);
            createPlayer();
          }
        }, 50);
      }
    }

    // সম্পূর্ণ প্লেয়ার বন্ধ করে সরাসরি মেইন পেজে ফিরিয়ে আনার মূল ফাংশন
    function closeActiveVideoPlayer() {
      stopBackgroundAudioEngine();
      if ('mediaSession' in navigator) {
        navigator.mediaSession.playbackState = 'none';
      }
      const isFS = document.fullscreenElement || 
                   document.webkitFullscreenElement || 
                   document.mozFullScreenElement || 
                   document.msFullscreenElement;
      if (isFS) {
        const exitFS = document.exitFullscreen || 
                       document.webkitExitFullscreen || 
                       document.mozCancelFullScreen || 
                       document.msExitFullscreen;
        if (exitFS) {
          try { exitFS.call(document); } catch (e) {}
        }
      }

      if (screen.orientation && screen.orientation.unlock) {
        try { screen.orientation.unlock(); } catch (e) {}
      }

      if (currentActiveContainer) {
        if (currentActiveContainer._timeCheckTimer) {
          clearInterval(currentActiveContainer._timeCheckTimer);
          currentActiveContainer._timeCheckTimer = null;
        }
        if (currentYTPlayer && typeof currentYTPlayer.destroy === 'function') {
          try { currentYTPlayer.destroy(); } catch (e) {}
          currentYTPlayer = null;
        }
        if (currentActiveContainer._originalThumbHTML) {
          currentActiveContainer.innerHTML = currentActiveContainer._originalThumbHTML;
          if (currentActiveContainer._savedOnClick) {
            currentActiveContainer.setAttribute('onclick', currentActiveContainer._savedOnClick);
          }
        }
        currentActiveContainer._stopPlayer = null;
        currentActiveContainer = null;
      }
    }

    // ফুলস্ক্রিন ও অরিয়েন্টেশন নিয়ন্ত্রণ
    function handleFullscreenOrientation() {
      const isFullscreen = document.fullscreenElement || 
                           document.webkitFullscreenElement || 
                           document.mozFullScreenElement || 
                           document.msFullscreenElement;

      if (isFullscreen) {
        if (screen.orientation && screen.orientation.lock) {
          if (currentActiveContainer && currentActiveContainer._isAudio) {
            screen.orientation.lock('portrait').catch(() => {});
          } else {
            screen.orientation.lock('landscape').catch(() => {});
          }
        }
      } else {
        // ফোন লক হলে (document.hidden) অথবা ব্যাকগ্রাউন্ডে গেলে প্লেয়ার কখনই বন্ধ হবে না
        if (document.hidden || (currentActiveContainer && currentActiveContainer._isScreenLocking)) {
          return;
        }

        // ইউজার যদি ম্যানুয়ালি ফুলস্ক্রিন বন্ধ করে তবে শুধুমাত্র ভিডিওটি স্বাভাবিক আকারে ফিরে আসবে, বন্ধ হবে না
        if (history.state && history.state.isFullscreenVideo) {
          history.back();
        }
      }
    }

    // আধুনিক ব্যাকগ্রাউন্ড কিপ-অ্যালাইভ ইঞ্জিন (Silent Audio Track + Web Audio Context)
    let bgAudioElement = null;
    let bgAudioContext = null;

    function startBackgroundAudioEngine() {
      try {
        // ১. একটি সাইলেন্ট অডিও ফাইল লুপে প্লে করা (ব্রাউজার ব্যাকগ্রাউন্ড প্রসেস যাতে স্লিপ না হয়)
        if (!bgAudioElement) {
          bgAudioElement = document.createElement('audio');
          bgAudioElement.setAttribute('id', 'bgAudioKeeper');
          bgAudioElement.setAttribute('loop', 'true');
          bgAudioElement.setAttribute('playsinline', 'true');
          bgAudioElement.setAttribute('preload', 'auto');
          // ৪৪.১kHz নীরব অডিও ডাটা URI
          bgAudioElement.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAP8A/w==";
          document.body.appendChild(bgAudioElement);
        }
        bgAudioElement.play().catch(() => {});

        // ২. ব্যাকআপ Web Audio Context
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          if (!bgAudioContext) {
            bgAudioContext = new AudioContextClass();
          }
          if (bgAudioContext.state === 'suspended') {
            bgAudioContext.resume().catch(() => {});
          }
        }
      } catch (e) {
        console.warn("Could not start background audio anchor:", e);
      }
    }

    function stopBackgroundAudioEngine() {
      try {
        if (bgAudioElement) {
          bgAudioElement.pause();
          bgAudioElement.removeAttribute('src');
          if (bgAudioElement.parentNode) {
            bgAudioElement.parentNode.removeChild(bgAudioElement);
          }
          bgAudioElement = null;
        }
        if (bgAudioContext && bgAudioContext.state !== 'closed') {
          bgAudioContext.close().catch(() => {});
          bgAudioContext = null;
        }
      } catch (e) {}
    }

    // মিডিয়া সেশন এবং লক স্ক্রিন নিয়ন্ত্রণ সেটআপ
    function setupMediaSession(title, artist) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: title || 'Madhyamik Bengali',
          artist: artist || 'Study Material',
          album: 'Class 10 Bengali'
        });

        navigator.mediaSession.setActionHandler('play', () => {
          if (currentYTPlayer && typeof currentYTPlayer.playVideo === 'function') {
            currentYTPlayer.playVideo();
          }
        });

        navigator.mediaSession.setActionHandler('pause', () => {
          if (currentYTPlayer && typeof currentYTPlayer.pauseVideo === 'function') {
            currentYTPlayer.pauseVideo();
          }
        });

        navigator.mediaSession.setActionHandler('stop', () => {
          closeActiveVideoPlayer();
        });
      }
    }

    // স্ক্রিন ভার্টিক্যাল (Portrait) হওয়া মাত্রই সাথে সাথে ভিডিও বন্ধ করার সংশোধিত লিসেনার
    // (নোট: ব্যাকগ্রাউন্ডে যাওয়া বা স্ক্রিন লক হওয়ার সময় এটি যেন প্লেয়ারকে জোর করে বন্ধ না করে)
    function checkPortraitAndClose() {
      if (!currentActiveContainer || currentActiveContainer._isAudio) return;
      if (document.hidden) return; // ফোন লক বা ব্যাকগ্রাউন্ডে থাকলে বন্ধ করা হবে না

      const isFS = document.fullscreenElement || 
                   document.webkitFullscreenElement || 
                   document.mozFullScreenElement || 
                   document.msFullscreenElement;

      // শুধুমাত্র ইউজার ফুলস্ক্রিন চলাকালীন হাত দিয়ে ফোন পোর্ট্রেটে ফেরালে ফুলস্ক্রিন থেকে বের হবে
      const isPortrait = window.matchMedia("(orientation: portrait)").matches || 
                         (screen.orientation && screen.orientation.type && screen.orientation.type.startsWith('portrait'));
      if (isPortrait && isFS) {
        const exitFS = document.exitFullscreen || 
                       document.webkitExitFullscreen || 
                       document.mozCancelFullScreen || 
                       document.msExitFullscreen;
        if (exitFS) exitFS.call(document).catch(() => {});
      }
    }

    window.addEventListener('orientationchange', () => {
      setTimeout(checkPortraitAndClose, 50);
    });

    if (screen.orientation && screen.orientation.addEventListener) {
      screen.orientation.addEventListener('change', checkPortraitAndClose);
    }

    // পেজ ব্যাকগ্রাউন্ডে বা স্ক্রিন লক হলে প্লেয়ার সচল রাখা নিশ্চিত করার হ্যান্ডলার
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        // স্ক্রিন লক হয়েছে বা অ্যাপ মিনিমাইজ হয়েছে
        if (currentActiveContainer) {
          currentActiveContainer._isScreenLocking = true;
          setTimeout(() => {
            if (currentActiveContainer) currentActiveContainer._isScreenLocking = false;
          }, 1000);
        }

        if (currentActiveContainer && currentActiveContainer._wasPlayingBeforeLock) {
          startBackgroundAudioEngine();
          // ইউটিউবের ব্যাকগ্রাউন্ডে অটো-পজ হওয়া ঠেকাতে মাল্টিপল ট্রাই সাইকেল
          [80, 200, 500, 1000].forEach(delay => {
            setTimeout(() => {
              if (currentYTPlayer && typeof currentYTPlayer.playVideo === 'function') {
                currentYTPlayer.playVideo();
              }
            }, delay);
          });
        }
      } else {
        // ইউজার স্ক্রিন আনলক করে ফিরে এলে
        if (currentActiveContainer) {
          currentActiveContainer._isScreenLocking = false;
          if (currentYTPlayer && typeof currentYTPlayer.getPlayerState === 'function') {
            if (currentActiveContainer._wasPlayingBeforeLock) {
              currentYTPlayer.playVideo();
            }
          }
        }
      }
    });

    // ফুলস্ক্রিন পরিবর্তন লিসেনার
    document.addEventListener('fullscreenchange', handleFullscreenOrientation);
    document.addEventListener('webkitfullscreenchange', handleFullscreenOrientation);
    document.addEventListener('mozfullscreenchange', handleFullscreenOrientation);
    document.addEventListener('MSFullscreenChange', handleFullscreenOrientation);

    // মোবাইলের ব্যাক বাটন / ব্যাক সোয়াইপ চাপলে সরাসরি মেইন পেজে ফিরে আসার হ্যান্ডলার
    window.addEventListener('popstate', () => {
      closeActiveVideoPlayer();
    });

    // SVG Icon Generator Helper
    function getResourceIconSvg(type) {

      switch (type) {
        case 'audio':
          return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18v-6a9 9 0 0 1 18 0v6"></path><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path></svg>`;

          return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z"></path><path d="M9 10h.01"></path><path d="M15 10h.01"></path><path d="M9.5 15a3.5 3.5 0 0 0 5 0"></path></svg>`;
