<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Madhyamik Bengali — Exam Chapter Stories</title>
  <style>
    :root {
      --bg-body: #f8fafc;
      --bg-header: rgba(255, 255, 255, 0.94);
      --bg-card: #ffffff;
      --bg-subtle: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      
            --primary: #ff0000;
      --primary-light: #fee2e2;
      --primary-text: #cc0000;
      
      --badge-video-bg: #fef2f2;
      --badge-video-text: #dc2626;
      --badge-video-border: #fecaca;

      
      --badge-audio-bg: #faf5ff;
      --badge-audio-text: #7e22ce;
      --badge-audio-border: #e9d5ff;
      
      --badge-cartoon-bg: #fffbeb;
      --badge-cartoon-text: #b45309;
      --badge-cartoon-border: #fde68a;
      
      --badge-realistic-bg: #ecfdf5;
      --badge-realistic-text: #047857;
      --badge-realistic-border: #a7f3d0;
      
      --badge-totopia-bg: #fff1f2;
      --badge-totopia-text: #be123c;
      --badge-totopia-border: #fecdd3;

            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
      --card-shadow-active: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 10px;
      --radius-pill: 9999px;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }


    @media (prefers-color-scheme: dark) {
      :root {
        --bg-body: #0b0f19;
        --bg-header: rgba(15, 23, 42, 0.94);
        --bg-card: #151d2e;
        --bg-subtle: #1e293b;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border-color: #273549;

        --primary: #3b82f6;
        --primary-light: #1e3a8a;
        --primary-text: #93c5fd;

        --badge-video-bg: #172554;
        --badge-video-text: #93c5fd;
        --badge-video-border: #1e40af;

        --badge-audio-bg: #2e1065;
        --badge-audio-text: #d8b4fe;
        --badge-audio-border: #581c87;

        --badge-cartoon-bg: #451a03;
        --badge-cartoon-text: #fde68a;
        --badge-cartoon-border: #78350f;

        --badge-realistic-bg: #064e3b;
        --badge-realistic-text: #a7f3d0;
        --badge-realistic-border: #065f46;

        --badge-totopia-bg: #4c0519;
        --badge-totopia-text: #fecdd3;
        --badge-totopia-border: #881337;

        --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Bengali", "Kalpurush", sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 50px;
    }

    .app-container {
      max-width: 640px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Sticky Header - YouTube Mobile Style */
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 8px 12px 6px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 44px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .brand-icon {
      width: 30px;
      height: 22px;
      color: #ff0000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-icon svg {
      width: 100%;
      height: 100%;
    }

    .header-titles {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .header-titles h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .header-titles h1 span {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-left: 2px;
    }

    .yt-top-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--text-main);
    }

    .yt-icon-btn {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .yt-icon-btn svg {
      width: 22px;
      height: 22px;
    }

    /* Search & Filter Container */
    .control-panel {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .search-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 42px;
      padding: 0 40px 0 38px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 0.92rem;
      color: var(--text-main);
      outline: none;
      transition: var(--transition);
      font-family: inherit;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15);
    }

    .clear-search-btn {
      position: absolute;
      right: 10px;
      background: transparent;
      border: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      cursor: pointer;
    }

    .clear-search-btn svg {
      width: 16px;
      height: 16px;
    }

    /* Horizontal Filter Pills - YouTube Chip Row */
    .filters-scroll-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    .explore-btn {
      width: 34px;
      height: 32px;
      border-radius: 6px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
    }

    .explore-btn svg {
      width: 18px;
      height: 18px;
    }

    .filters-divider {
      width: 1px;
      height: 20px;
      background: var(--border-color);
      flex-shrink: 0;
    }

    .filters-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0;
      scrollbar-width: none;
      -ms-overflow-style: none;
      flex: 1;
    }

    .filters-scroll::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--bg-subtle);
      border: 1px solid transparent;
      color: var(--text-main);
      font-size: 0.82rem;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 8px;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease;
    }

    .filter-btn.active {
      background: var(--text-main);
      color: var(--bg-card);
    }


    /* YouTube Mobile Feed Layout */
    .content-area {
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .results-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 500;
      padding: 8px 14px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .yt-video-card {
      display: flex;
      flex-direction: column;
      background: var(--bg-card);
      text-decoration: none;
      color: inherit;
    }

    .resource-thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background-color: #ffffff;
      border: 1px solid var(--border-color);
      cursor: pointer;
    }

    .thumb-white-card {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
      background-color: #ffffff;
      box-sizing: border-box;
    }

    .thumb-card-tag {
      font-size: 0.75rem;
      font-weight: 600;
      color: #cc0000;
      background: #fee2e2;
      padding: 2px 10px;
      border-radius: 9999px;
      margin-bottom: 8px;
    }

    .thumb-card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .thumb-card-subtitle {
      font-size: 0.8rem;
      color: #64748b;
      margin-bottom: 10px;
    }

    .thumb-card-play {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #ff0000;
      color: #ffffff;
      box-shadow: 0 4px 8px rgba(255, 0, 0, 0.25);
    }

    .thumb-card-play svg {
      width: 18px;
      height: 18px;
      margin-left: 2px;
    }

    /* Thumbnail Inside Options Overlay */
    .thumb-picker-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      z-index: 10;
    }

    .thumb-picker-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border-color);
    }

    .thumb-picker-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .thumb-picker-close {
      background: none;
      border: none;
      font-size: 1.1rem;
      line-height: 1;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 6px;
    }

    .thumb-picker-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      flex: 1;
    }

    .thumb-picker-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
    }

    .thumb-picker-btn:hover,
    .thumb-picker-btn:active {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary-text);
    }

    .thumb-picker-btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .resource-thumb-wrap iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* Video perfectly centered on screen in Fullscreen mode */
    .resource-thumb-wrap iframe:fullscreen,
    .resource-thumb-wrap iframe:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      margin: auto !important;
      padding: 0 !important;
      border: 0 !important;
    }

    /* Clean Play Icon without background shadow box */
    .yt-inline-play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: transparent;
      box-shadow: none;
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      pointer-events: none;
    }

    .yt-inline-play-btn svg {
      width: 44px;
      height: 44px;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.65));
    }

    /* Screen-matched Overlays */
    .yt-top-badges {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .yt-circle-badge {
      width: 30px;
      height: 30px;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }

    .yt-circle-badge svg {
      width: 16px;
      height: 16px;
    }

    .yt-duration-badge {
      position: absolute;
      right: 6px;
      bottom: 6px;
      background: rgba(0, 0, 0, 0.8);
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 500;
      padding: 2px 5px;
      border-radius: 4px;
    }

    .yt-video-info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 8px;
    }

    .yt-channel-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #e11d48;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.78rem;
      flex-shrink: 0;
      overflow: hidden;
    }

    .yt-video-text {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .yt-video-title {
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.2;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    .yt-video-meta {
      font-size: 0.72rem;
      color: var(--text-muted);
      line-height: 1.15;
      margin: 2px 0 0 0;
      padding: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .yt-more-btn {
      background: none;
      border: none;
      color: var(--text-main);
      width: 24px;
      height: 24px;
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .yt-more-btn svg {
      width: 18px;
      height: 18px;
    }




    /* Type Specific Badges */
    .type-video .resource-type-icon {
      background: var(--badge-video-bg);
      color: var(--badge-video-text);
      border: 1px solid var(--badge-video-border);
    }
    .type-video .action-badge {
      background: var(--badge-video-bg);
      color: var(--badge-video-text);
      border: 1px solid var(--badge-video-border);
    }

    .type-audio .resource-type-icon {
      background: var(--badge-audio-bg);
      color: var(--badge-audio-text);
      border: 1px solid var(--badge-audio-border);
    }
    .type-audio .action-badge {
      background: var(--badge-audio-bg);
      color: var(--badge-audio-text);
      border: 1px solid var(--badge-audio-border);
    }

    .type-cartoon .resource-type-icon {
      background: var(--badge-cartoon-bg);
      color: var(--badge-cartoon-text);
      border: 1px solid var(--badge-cartoon-border);
    }
    .type-cartoon .action-badge {
      background: var(--badge-cartoon-bg);
      color: var(--badge-cartoon-text);
      border: 1px solid var(--badge-cartoon-border);
    }

    .type-realistic .resource-type-icon {
      background: var(--badge-realistic-bg);
      color: var(--badge-realistic-text);
      border: 1px solid var(--badge-realistic-border);
    }
    .type-realistic .action-badge {
      background: var(--badge-realistic-bg);
      color: var(--badge-realistic-text);
      border: 1px solid var(--badge-realistic-border);
    }

    .type-totopia .resource-type-icon {
      background: var(--badge-totopia-bg);
      color: var(--badge-totopia-text);
      border: 1px solid var(--badge-totopia-border);
    }
    .type-totopia .action-badge {
      background: var(--badge-totopia-bg);
      color: var(--badge-totopia-text);
      border: 1px solid var(--badge-totopia-border);
    }

    /* Empty Search State */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      margin: 10px 0;
    }

    .empty-icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 12px;
      color: var(--text-muted);
      opacity: 0.7;
    }

    .empty-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .empty-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .reset-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: var(--radius-pill);
      cursor: pointer;
    }

    /* Exam Guidance Footer */
    .footer-note {
      text-align: center;
      padding: 20px 16px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .footer-note strong {
      color: var(--text-main);
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Top Header - YouTube Mobile Style -->
    <header class="sticky-header">
      <div class="header-top">
        <div class="brand-group">
          <div class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
          </div>
          <div class="header-titles">
            <h1>Madhyamik <span>Bengali</span></h1>
          </div>
        </div>

        <div class="yt-top-actions">
          <button class="yt-icon-btn" aria-label="Create">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="23 7 16 12 23 17 23 7"></polygon>
              <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
            </svg>
          </button>
          <button class="yt-icon-btn" id="openSearchBtn" aria-label="Search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- Search & Filters -->
      <div class="control-panel">
        <div class="search-wrapper" id="searchWrapper" style="display: none;">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input 
            type="search" 
            id="searchInput" 
            class="search-input" 
            placeholder="Search chapters or topics..." 
            autocomplete="off"
            aria-label="Search Chapters"
          >
          <button id="clearSearchBtn" class="clear-search-btn" title="Clear search" aria-label="Clear Search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <!-- YouTube Chip Filter Row (With Explore Button) -->
        <div class="filters-scroll-wrapper">
          <button class="explore-btn" aria-label="Explore">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
            </svg>
          </button>
          <div class="filters-divider"></div>
          <div class="filters-scroll" role="tablist" aria-label="Filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="video">Video</button>
            <button class="filter-btn" data-filter="audio">Audio</button>
            <button class="filter-btn" data-filter="cartoon">Cartoon</button>
            <button class="filter-btn" data-filter="realistic">Realistic</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content List -->
    <main class="content-area">

  </div>

  <script>
    // Exact Chapter Data Array preserving names, numbers, labels, and exact URLs
    const chaptersData = [
      {
        number: 1,

          {

          },

          }
        ]
      },
      {
        number: 6,
        title: "নদীর বিদ্রোহ",
        resources: [
          {
            type: "audio",
            label: "Audio",
            action: "Listen",
            url: "https://youtu.be/z2aU0KrnA5U?start=90&end=580"
          }
        ]
      },
                {
            number: 9,
            title: "হারিয়ে যাওয়া কালি কলম",
            resources: [
              {
                type: "video",
                label: "Video",
                action: "Watch",
                url: "https://youtu.be/-gpWFyXdkA8"
              }
            ]
          }
        ];

    // YouTube ID Extractor Helper
    function getYoutubeVideoId(url) {
      try {
        const urlObj = new URL(url);
        if (urlObj.hostname.includes('youtu.be')) {
          return urlObj.pathname.slice(1).split('?')[0];
        } else if (urlObj.searchParams.has('v')) {
          return urlObj.searchParams.get('v');
        }
        return '';
      } catch (e) {
        return '';
      }
    }

    // YouTube Start Time Extractor Helper
    function getYoutubeStartTime(url) {
      try {
        const urlObj = new URL(url);
        const t = urlObj.searchParams.get('t') || urlObj.searchParams.get('start');
        return t ? parseInt(t, 10) : 0;
      } catch (e) {
        return 0;
      }
    }

    // YouTube End Time Extractor Helper
    function getYoutubeEndTime(url) {
      try {
        const urlObj = new URL(url);
        const end = urlObj.searchParams.get('end');
        return end ? parseInt(end, 10) : 0;
      } catch (e) {
        return 0;
      }
    }

    // YouTube Thumbnail Generator Helper
    function getYoutubeThumbnailUrl(url) {
      const videoId = getYoutubeVideoId(url);
      return videoId ? `https://img.youtube.com/vi/${videoId}/mqdefault.jpg` : '';
    }

    // Track currently playing video container and YouTube API player instance
    let currentActiveContainer = null;
    let currentYTPlayer = null;

    // Load YouTube IFrame API script automatically if not present
    if (!window.YT) {
      const tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      const firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    }

    // Helper to open options list directly inside the thumbnail
    function openChapterOptions(container, chapterIndex) {
      if (currentActiveContainer === container) return;

      const chapter = chaptersData[chapterIndex];
      if (!chapter) return;

      const resources = chapter.resources.filter(res => currentFilter === 'all' || res.type === currentFilter);
      if (resources.length === 0) return;

      // If only one resource available, directly play it
      if (resources.length === 1) {
        const singleVidId = getYoutubeVideoId(resources[0].url);
        const singleStartTime = getYoutubeStartTime(resources[0].url);
        const singleEndTime = getYoutubeEndTime(resources[0].url);
        playInlineVideo(container, singleVidId, singleStartTime, singleEndTime);
        return;
      }

      // Save initial cover thumbnail if not saved
      if (!container._originalThumbHTML) {
        container._originalThumbHTML = container.innerHTML;
      }

      let optionsListHtml = '';
      resources.forEach(res => {
        const vidId = getYoutubeVideoId(res.url);
        const startTime = getYoutubeStartTime(res.url);
        const endTime = getYoutubeEndTime(res.url);
        const iconSvg = res.action === 'Listen'
          ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>`
          : `<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>`;

        optionsListHtml += `
          <button class="thumb-picker-btn" onclick="event.stopPropagation(); playInlineVideo(this.closest('.resource-thumb-wrap'), '${vidId}', ${startTime}, ${endTime});">
            <span>${res.label} (${res.action === 'Listen' ? 'অডিও' : 'ভিডিও'})</span>
            ${iconSvg}
          </button>
        `;
      });

      container.innerHTML = `
        <div class="thumb-picker-overlay" onclick="event.stopPropagation();">
          <div class="thumb-picker-header">
            <span class="thumb-picker-title">${chapter.title} — সংস্করণ নির্বাচন করুন</span>
            <button class="thumb-picker-close" onclick="event.stopPropagation(); closeChapterOptions(this.closest('.resource-thumb-wrap'));" title="বন্ধ করুন">✕</button>
          </div>
          <div class="thumb-picker-list">
            ${optionsListHtml}
          </div>
        </div>
      `;
    }

    function closeChapterOptions(container) {
      if (container && container._originalThumbHTML) {
        container.innerHTML = container._originalThumbHTML;
      }
    }

    // Function to play video instantly on a single click with minimal YouTube suggestions
    function playInlineVideo(container, videoId, startTime = 0, endTime = 0) {
      if (!videoId) return;

      // If this video is already playing, do nothing
      if (currentActiveContainer === container) return;

      // Stop previous player instance, clear timers, and restore its thumbnail
      if (currentActiveContainer && currentActiveContainer !== container && currentActiveContainer.isConnected) {
        if (currentActiveContainer._timeCheckTimer) {
          clearInterval(currentActiveContainer._timeCheckTimer);
          currentActiveContainer._timeCheckTimer = null;
        }
        if (currentYTPlayer && typeof currentYTPlayer.destroy === 'function') {
          try { currentYTPlayer.destroy(); } catch (e) {}
          currentYTPlayer = null;
        }
        if (currentActiveContainer._originalThumbHTML) {
          currentActiveContainer.innerHTML = currentActiveContainer._originalThumbHTML;
          if (currentActiveContainer._savedOnClick) {
            currentActiveContainer.setAttribute('onclick', currentActiveContainer._savedOnClick);
          }
        }
      }

      // Save the initial thumbnail UI before inserting player
      if (!container._originalThumbHTML) {
        container._originalThumbHTML = container.innerHTML;
      }
      if (!container._savedOnClick) {
        container._savedOnClick = container.getAttribute('onclick');
      }

      container._savedVideoId = videoId;
      currentActiveContainer = container;

      // Remove click handler from container while playing
      container.removeAttribute('onclick');

      // Create an internal mount element for YouTube Player
      const uniquePlayerId = 'yt_player_' + Math.random().toString(36).substring(2, 9);
      container.innerHTML = `<div id="${uniquePlayerId}" style="width:100%;height:100%;"></div>`;

      const playerVarsObj = {
        autoplay: 1,
        playsinline: 1,
        fs: 1,
        rel: 0,
        iv_load_policy: 3,
        modestbranding: 1,
        enablejsapi: 1,
        start: startTime || 0
      };

      if (endTime > 0) {
        playerVarsObj.end = endTime;
      }

      function stopAndClosePlayer() {
        if (container._timeCheckTimer) {
          clearInterval(container._timeCheckTimer);
          container._timeCheckTimer = null;
        }
        if (currentYTPlayer && typeof currentYTPlayer.destroy === 'function') {
          try { currentYTPlayer.destroy(); } catch (e) {}
          currentYTPlayer = null;
        }
        if (container._originalThumbHTML) {
          container.innerHTML = container._originalThumbHTML;
          if (container._savedOnClick) {
            container.setAttribute('onclick', container._savedOnClick);
          }
        }
        currentActiveContainer = null;
      }

      function createPlayer() {
        currentYTPlayer = new YT.Player(uniquePlayerId, {
          width: '100%',
          height: '100%',
          videoId: videoId,
          playerVars: playerVarsObj,
          events: {
            onReady: function(event) {
              if (startTime > 0) {
                event.target.seekTo(startTime, true);
              }
              event.target.playVideo();
            },
            onStateChange: function(event) {
              if (event.data === YT.PlayerState.PLAYING && endTime > 0) {
                if (!container._timeCheckTimer) {
                  container._timeCheckTimer = setInterval(() => {
                    if (currentYTPlayer && typeof currentYTPlayer.getCurrentTime === 'function') {
                      const currentTime = currentYTPlayer.getCurrentTime();
                      if (currentTime >= endTime) {
                        stopAndClosePlayer();
                      }
                    }
                  }, 500);
                }
              } else if (event.data === YT.PlayerState.ENDED) {
                stopAndClosePlayer();
              } else if (event.data === YT.PlayerState.PAUSED && endTime > 0) {
                if (currentYTPlayer && typeof currentYTPlayer.getCurrentTime === 'function') {
                  const currentTime = currentYTPlayer.getCurrentTime();
                  if (currentTime >= endTime) {
                    stopAndClosePlayer();
                  }
                }
              }
            }
          }
        });
      }

      if (window.YT && window.YT.Player) {
        createPlayer();
      } else {
        const checkYTReady = setInterval(() => {
          if (window.YT && window.YT.Player) {
            clearInterval(checkYTReady);
            createPlayer();
          }
        }, 50);
      }
    }

    // Auto-lock to Landscape (Horizontal) when video enters Fullscreen
    function handleFullscreenOrientation() {
      const isFullscreen = document.fullscreenElement || 
                           document.webkitFullscreenElement || 
                           document.mozFullScreenElement || 
                           document.msFullscreenElement;

      if (isFullscreen) {
        // Force screen orientation to Landscape
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(() => {
            // Fallback for browsers with strict orientation permission
          });
        }
      } else {
        // Unlock orientation back to normal when exiting Fullscreen
        if (screen.orientation && screen.orientation.unlock) {
          try {
            screen.orientation.unlock();
          } catch (e) {}
        }
      }
    }

    // Listen to Fullscreen changes across different mobile browsers
    document.addEventListener('fullscreenchange', handleFullscreenOrientation);
    document.addEventListener('webkitfullscreenchange', handleFullscreenOrientation);
    document.addEventListener('mozfullscreenchange', handleFullscreenOrientation);
    document.addEventListener('MSFullscreenChange', handleFullscreenOrientation);

    // SVG Icon Generator Helper
    function getResourceIconSvg(type) {

      switch (type) {
        case 'audio':
          return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18v-6a9 9 0 0 1 18 0v6"></path><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path></svg>`;
        case 'cartoon':
          return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z"></path><path d="M9 10h.01"></path><path d="M15 10h.01"></path><path d="M9.5 15a3.5 3.5 0 0 0 5 0"></path></svg>`;
        case 'realistic':
          return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg>`;
        case 'totopia':
          return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>`;
        case 'video':
        default:
          return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>`;
      }
    }

    function getActionIconSvg(action) {
      if (action === "Listen") {
        return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>`;
      }
      return `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>`;
    }

    // Bangla Number Formatter Helper
    function toBengaliNumeral(num) {
      const bnDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
      return String(num).replace(/[0-9]/g, (d) => bnDigits[d]);
    }

    // App State
    let currentFilter = 'all';
    let searchQuery = '';

    // DOM Elements
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const filterButtons = document.querySelectorAll('.filter-btn');
    const chaptersContainer = document.getElementById('chaptersContainer');
    const emptyState = document.getElementById('emptyState');
    const resetFilterBtn = document.getElementById('resetFilterBtn');
    const statusIndicator = document.getElementById('statusIndicator');
    const resourceTotalIndicator = document.getElementById('resourceTotalIndicator');

    // Render Cards - 1 Master Card Per Chapter with In-Thumbnail Options Selector
    function renderApp() {
      const query = searchQuery.trim().toLowerCase();
      let visibleChaptersCount = 0;
      let totalVisibleResources = 0;

      chaptersContainer.innerHTML = '';

      const matchedChapters = [];

      chaptersData.forEach((chapter, chapterIndex) => {
        const matchesQuery = !query || 
          chapter.title.toLowerCase().includes(query) || 
          String(chapter.number).includes(query) ||
          chapter.resources.some(res => res.label.toLowerCase().includes(query));

        const matchedResources = chapter.resources.filter(res => {
          return currentFilter === 'all' || res.type === currentFilter;
        });

        if (matchesQuery && matchedResources.length > 0) {
          matchedChapters.push({
            chapter,
            chapterIndex,
            resources: matchedResources
          });
          totalVisibleResources += matchedResources.length;
        }
      });

      if (matchedChapters.length === 0) {
        chaptersContainer.style.display = 'none';
        emptyState.style.display = 'block';
        statusIndicator.textContent = '০ টি অধ্যায়';
        resourceTotalIndicator.textContent = '';
        return;
      }

      chaptersContainer.style.display = 'flex';
      chaptersContainer.style.flexDirection = 'column';
      chaptersContainer.style.gap = '12px';
      emptyState.style.display = 'none';

      matchedChapters.forEach(({ chapter, chapterIndex, resources }) => {
        visibleChaptersCount++;
        const card = document.createElement('article');
        card.className = 'yt-video-card';

        const initialChar = chapter.title.charAt(0);
        const resourceCountText = `${toBengaliNumeral(resources.length)} টি সংস্করণ`;

        card.innerHTML = `
          <div 
            class="resource-thumb-wrap" 
            role="button" 
            tabindex="0"
            aria-label="${chapter.title} বিকল্পগুলি দেখুন"
            onclick="openChapterOptions(this, ${chapterIndex})"
          >
            <div class="thumb-white-card">
              <span class="thumb-card-tag">অধ্যায় ${toBengaliNumeral(chapter.number)} • ${resourceCountText}</span>
              <h3 class="thumb-card-title">${chapter.title}</h3>
              <p class="thumb-card-subtitle">মাধ্যমিক বাংলা সাহিত্য • ক্লিক করে সংস্করণ বাছুন</p>
              <div class="thumb-card-play" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <polygon points="6 3 20 12 6 21 6 3"></polygon>
                </svg>
              </div>
            </div>
            <div class="yt-duration-badge">
              ${toBengaliNumeral(resources.length)} টি ভিডিও/অডিও
            </div>
          </div>

          <div class="yt-video-info-row">
            <div class="yt-channel-avatar">
              ${initialChar}
            </div>
            <div class="yt-video-text">
              <h2 
                class="yt-video-title" 
                style="cursor: pointer;"
                onclick="const wrap = this.closest('.yt-video-card').querySelector('.resource-thumb-wrap'); openChapterOptions(wrap, ${chapterIndex});"
              >
                ${chapter.title} (অধ্যায় ${toBengaliNumeral(chapter.number)})
              </h2>
              <div class="yt-video-meta">
                Class 10 Bengali • Madhyamik Prep • ${resourceCountText} উপলব্ধ
              </div>
            </div>
            <button class="yt-more-btn" aria-label="More options" onclick="event.stopPropagation();">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <circle cx="12" cy="5" r="2"></circle>
                <circle cx="12" cy="12" r="2"></circle>
                <circle cx="12" cy="19" r="2"></circle>
              </svg>
            </button>
          </div>
        `;

        chaptersContainer.appendChild(card);
      });

      statusIndicator.textContent = `দেখাচ্ছে ${toBengaliNumeral(visibleChaptersCount)} টি অধ্যায়`;
      resourceTotalIndicator.textContent = `মোট ${toBengaliNumeral(totalVisibleResources)} টি রিসোর্স`;
    }

    // YouTube Mobile Search Bar Toggle
    const openSearchBtn = document.getElementById('openSearchBtn');
    const searchWrapper = document.getElementById('searchWrapper');

    if (openSearchBtn && searchWrapper) {
      openSearchBtn.addEventListener('click', () => {
        const isHidden = searchWrapper.style.display === 'none';
        searchWrapper.style.display = isHidden ? 'flex' : 'none';
        if (isHidden) {
          searchInput.focus();
        }
      });
    }

    // Search Handlers
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      clearSearchBtn.style.display = searchQuery.length > 0 ? 'flex' : 'none';
      renderApp();
    });

    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      clearSearchBtn.style.display = 'none';
      searchInput.focus();
      renderApp();
    });

    // Filter Buttons Handlers
    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderApp();
      });
    });

    // Reset All Filters
    resetFilterBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      clearSearchBtn.style.display = 'none';
      currentFilter = 'all';
      filterButtons.forEach(b => {
        b.classList.toggle('active', b.dataset.filter === 'all');
      });
      renderApp();
    });

    // Initial Render
    renderApp();
  </script>
