<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Madhyamik Bengali — Exam Chapter Stories</title>
  <!-- Google Fonts & Material Symbols for Audio Player UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <style>
    :root {
      --bg-body: #f8fafc;
      --bg-header: rgba(255, 255, 255, 0.94);
      --bg-card: #ffffff;
      --bg-subtle: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      
            --primary: #ff0000;
      --primary-light: #fee2e2;
      --primary-text: #cc0000;
      
      --badge-video-bg: #fef2f2;
      --badge-video-text: #dc2626;
      --badge-video-border: #fecaca;

      
      --badge-audio-bg: #faf5ff;
      --badge-audio-text: #7e22ce;
      --badge-audio-border: #e9d5ff;
      
      --badge-cartoon-bg: #fffbeb;
      --badge-cartoon-text: #b45309;
      --badge-cartoon-border: #fde68a;
      
      --badge-realistic-bg: #ecfdf5;
      --badge-realistic-text: #047857;
      --badge-realistic-border: #a7f3d0;
      
      --badge-totopia-bg: #fff1f2;
      --badge-totopia-text: #be123c;
      --badge-totopia-border: #fecdd3;

            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
      --card-shadow-active: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 10px;
      --radius-pill: 9999px;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }


    @media (prefers-color-scheme: dark) {
      :root {
        --bg-body: #0b0f19;
        --bg-header: rgba(15, 23, 42, 0.94);
        --bg-card: #151d2e;
        --bg-subtle: #1e293b;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border-color: #273549;

        --primary: #3b82f6;
        --primary-light: #1e3a8a;
        --primary-text: #93c5fd;

        --badge-video-bg: #172554;
        --badge-video-text: #93c5fd;
        --badge-video-border: #1e40af;

        --badge-audio-bg: #2e1065;
        --badge-audio-text: #d8b4fe;
        --badge-audio-border: #581c87;

        --badge-cartoon-bg: #451a03;
        --badge-cartoon-text: #fde68a;
        --badge-cartoon-border: #78350f;

        --badge-realistic-bg: #064e3b;
        --badge-realistic-text: #a7f3d0;
        --badge-realistic-border: #065f46;

        --badge-totopia-bg: #4c0519;
        --badge-totopia-text: #fecdd3;
        --badge-totopia-border: #881337;

        --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Bengali", "Kalpurush", sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 0;
    }

    .app-container {
      max-width: 640px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Sticky Header - YouTube Mobile Style */
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 8px 12px 6px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 44px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .brand-icon {
      width: 30px;
      height: 22px;
      color: #ff0000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-icon svg {
      width: 100%;
      height: 100%;
    }

    .header-titles {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .header-titles h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .header-titles h1 span {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-left: 2px;
    }

    .yt-top-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--text-main);
    }

    .yt-icon-btn {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .yt-icon-btn svg {
      width: 22px;
      height: 22px;
    }

        /* Search & Filter Container */
    .control-panel {
      margin-top: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }


    .search-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 42px;
      padding: 0 40px 0 38px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 0.92rem;
      color: var(--text-main);
      outline: none;
      transition: var(--transition);
      font-family: inherit;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15);
    }

    .clear-search-btn {
      position: absolute;
      right: 10px;
      background: transparent;
      border: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      cursor: pointer;
    }

    .clear-search-btn svg {
      width: 16px;
      height: 16px;
    }

        /* Horizontal Filter Pills - YouTube Chip Row */
    .filters-scroll-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 0;
    }


    .explore-btn {
      width: 34px;
      height: 32px;
      border-radius: 6px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
    }

    .explore-btn svg {
      width: 18px;
      height: 18px;
    }

    .filters-divider {
      width: 1px;
      height: 20px;
      background: var(--border-color);
      flex-shrink: 0;
    }

    .filters-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0;
      scrollbar-width: none;
      -ms-overflow-style: none;
      flex: 1;
    }

    .filters-scroll::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--bg-subtle);
      border: 1px solid transparent;
      color: var(--text-main);
      font-size: 0.82rem;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 3px;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease;
    }

    .filter-btn.active {
      background: var(--text-main);
      color: var(--bg-card);
    }


    /* YouTube Mobile Feed Layout */
    .content-area {
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .results-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 500;
      padding: 8px 14px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .yt-video-card {
      display: flex;
      flex-direction: column;
      background: var(--bg-card);
      text-decoration: none;
      color: inherit;
    }

    .resource-thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background-color: #000000;
      border: 1px solid var(--border-color);
      cursor: pointer;
    }

    .thumb-white-card {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
      background-color: #ffffff;
      box-sizing: border-box;
    }

    .thumb-card-tag {
      font-size: 0.75rem;
      font-weight: 600;
      color: #cc0000;
      background: #fee2e2;
      padding: 2px 10px;
      border-radius: 9999px;
      margin-bottom: 8px;
    }

    .thumb-card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .thumb-card-subtitle {
      font-size: 0.8rem;
      color: #64748b;
      margin-bottom: 10px;
    }

                    .thumb-card-play {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #e60000;
      color: #ffffff;
      border: 2px solid #ffffff;
      box-shadow: 
        0 0 0 2px #cc0000,
        0 4px 0 #990000,
        0 5px 0 #660000,
        0 8px 12px rgba(0, 0, 0, 0.25);
      transition: transform 0.1s cubic-bezier(0.2, 0, 0.2, 1), box-shadow 0.1s cubic-bezier(0.2, 0, 0.2, 1);
    }

    .thumb-card-play svg {
      width: 17px;
      height: 17px;
      margin-left: 2px;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.4));
    }

    .resource-thumb-wrap:hover .thumb-card-play {
      transform: translateY(-2px);
      box-shadow: 
        0 0 0 2px #cc0000,
        0 6px 0 #990000,
        0 7px 0 #660000,
        0 12px 16px rgba(0, 0, 0, 0.3);
    }

    .resource-thumb-wrap:active .thumb-card-play,
    .thumb-card-play.is-pressed {
      transform: translateY(5px) scale(0.96) !important;
      box-shadow: 
        0 0 0 2px #cc0000,
        0 0 0 #990000,
        0 1px 0 #660000,
        0 2px 4px rgba(0, 0, 0, 0.3) !important;
    }





    /* Thumbnail Inside Options Overlay */
    .thumb-picker-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      z-index: 10;
    }

    .thumb-picker-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border-color);
    }

    .thumb-picker-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .thumb-picker-close {
      background: none;
      border: none;
      font-size: 1.1rem;
      line-height: 1;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 6px;
    }

    .thumb-picker-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      flex: 1;
    }

    .thumb-picker-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
    }

    .thumb-picker-btn:hover,
    .thumb-picker-btn:active {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary-text);
    }

    .thumb-picker-btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .resource-thumb-wrap iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* Video completely covers the mobile screen ONLY in Landscape mode */
    :fullscreen,
    ::backdrop {
      background-color: #000000 !important;
    }

    @media (orientation: landscape) {
      .resource-thumb-wrap iframe:fullscreen,
      .resource-thumb-wrap iframe:-webkit-full-screen,
      .resource-thumb-wrap iframe:-moz-full-screen,
      .resource-thumb-wrap iframe:-ms-fullscreen {
        width: 100vw !important;
        height: 100vh !important;
        height: 100dvh !important;
        max-width: 100vw !important;
        max-height: 100dvh !important;
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        inset: 0 !important;
        transform: none !important;
        margin: 0 !important;
        border: 0 !important;
        background: #000000 !important;
        z-index: 2147483647 !important;
      }
    }

    /* ভার্টিক্যাল (Portrait) অবস্থায় কোনো ফুলস্ক্রিন কালো পেজ থাকবে না */
    @media (orientation: portrait) {
      .resource-thumb-wrap iframe:fullscreen,
      .resource-thumb-wrap iframe:-webkit-full-screen {
        position: static !important;
        width: 100% !important;
        height: 100% !important;
      }
    }

    /* Clean Play Icon without background shadow box */
    .yt-inline-play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: transparent;
      box-shadow: none;
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      pointer-events: none;
    }

    .yt-inline-play-btn svg {
      width: 44px;
      height: 44px;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.65));
    }

    /* Screen-matched Overlays */
    .yt-top-badges {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .yt-circle-badge {
      width: 30px;
      height: 30px;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }

    .yt-circle-badge svg {
      width: 16px;
      height: 16px;
    }

    .yt-duration-badge {
      position: absolute;
      right: 8px;
      bottom: 8px;
      background: transparent;
      border: none;
      box-shadow: none;
      color: #64748b;
      font-size: 0.70rem;
      font-weight: 600;
      line-height: 1;
      padding: 0;
    }

    .yt-video-info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 8px;
    }

    .yt-channel-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #e11d48;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.78rem;
      flex-shrink: 0;
      overflow: hidden;
    }

    .yt-video-text {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .yt-video-title {
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.2;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    .yt-video-meta {
      font-size: 0.72rem;
      color: var(--text-muted);
      line-height: 1.15;
      margin: 2px 0 0 0;
      padding: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .yt-more-btn {
      background: none;
      border: none;
      color: var(--text-main);
      width: 24px;
      height: 24px;
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .yt-more-btn svg {
      width: 18px;
      height: 18px;
    }




    /* Type Specific Badges */
    .type-video .resource-type-icon {
      background: var(--badge-video-bg);
      color: var(--badge-video-text);
      border: 1px solid var(--badge-video-border);
    }
    .type-video .action-badge {
      background: var(--badge-video-bg);
      color: var(--badge-video-text);
      border: 1px solid var(--badge-video-border);
    }

    .type-audio .resource-type-icon {
      background: var(--badge-audio-bg);
      color: var(--badge-audio-text);
      border: 1px solid var(--badge-audio-border);
    }
    .type-audio .action-badge {
      background: var(--badge-audio-bg);
      color: var(--badge-audio-text);
      border: 1px solid var(--badge-audio-border);
    }

    .type-cartoon .resource-type-icon {
      background: var(--badge-cartoon-bg);
      color: var(--badge-cartoon-text);
      border: 1px solid var(--badge-cartoon-border);
    }
    .type-cartoon .action-badge {
      background: var(--badge-cartoon-bg);
      color: var(--badge-cartoon-text);
      border: 1px solid var(--badge-cartoon-border);
    }

    .type-realistic .resource-type-icon {
      background: var(--badge-realistic-bg);
      color: var(--badge-realistic-text);
      border: 1px solid var(--badge-realistic-border);
    }
    .type-realistic .action-badge {
      background: var(--badge-realistic-bg);
      color: var(--badge-realistic-text);
      border: 1px solid var(--badge-realistic-border);
    }

    .type-totopia .resource-type-icon {
      background: var(--badge-totopia-bg);
      color: var(--badge-totopia-text);
      border: 1px solid var(--badge-totopia-border);
    }
    .type-totopia .action-badge {
      background: var(--badge-totopia-bg);
      color: var(--badge-totopia-text);
      border: 1px solid var(--badge-totopia-border);
    }

    /* Empty Search State */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      margin: 10px 0;
    }

    .empty-icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 12px;
      color: var(--text-muted);
      opacity: 0.7;
    }

    .empty-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .empty-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .reset-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: var(--radius-pill);
      cursor: pointer;
    }

    

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    /* Visual Poem Viewer Styles */
    .poem-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .poem-modal-overlay.active {
      display: flex;
    }

    .poem-modal-card {
      background: var(--bg-card);
      width: 100%;
      max-width: 580px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
      max-height: 94vh;
    }

    .poem-modal-header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-subtle);
    }

    .poem-modal-header-info h3 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 0;
    }

    .poem-modal-header-info p {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin: 2px 0 0;
    }

    .poem-modal-close-btn {
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      line-height: 1;
    }

    .poem-scene-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .poem-scene-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }

    .poem-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.6);
      color: #ffffff;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 5;
      transition: background 0.2s ease;
    }

    .poem-nav-btn:hover {
      background: rgba(0, 0, 0, 0.9);
    }

    .poem-nav-prev {
      left: 10px;
    }

    .poem-nav-next {
      right: 10px;
    }

    .poem-nav-btn svg {
      width: 20px;
      height: 20px;
    }

    .poem-text-content {
      padding: 16px;
      overflow-y: auto;
      max-height: 210px;
      text-align: center;
      background: var(--bg-card);
    }

    .poem-stanza-text {
      font-size: 0.95rem;
      line-height: 1.8;
      color: var(--text-main);
      font-weight: 500;
      white-space: pre-line;
      margin: 0;
    }

    .poem-modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-top: 1px solid var(--border-color);
      background: var(--bg-subtle);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .poem-action-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* Voice Wave Overlay & Hidden Audio Player */
    .audio-hidden-mount {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      opacity: 0 !important;
      pointer-events: none !important;
      z-index: -1 !important;
      visibility: hidden !important;
    }

    .audio-player-wrapper {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
      overflow: hidden;
    }

    .resource-thumb-wrap:fullscreen,
    .resource-thumb-wrap:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      background: #000000 !important;
    }

    .player-container {
      background-color: #1a1c0d; 
      width: 100%;
      max-width: 450px;
      padding: 15px 24px 20px 24px;
      height: 100%;
      display: flex;
      flex-direction: column;
      color: #ffffff;
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* --- নেভিগেশন বার --- */
    .nav-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      flex-shrink: 0;
      height: 55px; 
    }

    .nav-btn {
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background 0.2s;
    }

    .back-nav-btn {
      position: relative;
      top: 0px;    
      left: -15px; 
      z-index: 10;
    }

    .back-nav-btn svg {
      width: 32px; 
      height: 32px;
    }

    .more-menu-btn {
      position: relative; 
      top: 0px;    
      left: 21px;  
      z-index: 10;
    }

    .more-menu-btn svg {
      width: 24px;
      height: 24px;
    }

    .nav-btn:active {
      background: rgba(255, 255, 255, 0.1);
    }

                    /* অ্যালবাম আর্ট বক্স সম্পূর্ণ মুছে ফেলা হয়েছে */





    /* অ্যাকশন বাটন সেকশন */
    .action-buttons {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 15px;
      padding-bottom: 2px;
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 0;
      max-height: 50px;
      opacity: 1;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .action-buttons::-webkit-scrollbar {
      display: none;
    }

    .btn {
      background-color: rgba(255, 255, 255, 0.08);
      border: none;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 25px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .divider {
      width: 1px;
      height: 18px;
      background-color: rgba(255, 255, 255, 0.2);
      margin: 0 4px;
    }

    /* প্রোগ্রেস বার */
    .progress-container {
      margin-bottom: 12px; 
      flex-shrink: 0;
      max-height: 30px;
      opacity: 1;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .progress-bar-wrapper {
      position: relative;
      height: 12px;
      display: flex;
      align-items: center;
      cursor: pointer;
      touch-action: none;
    }

    .progress-track {
      width: 100%;
      height: 3px;
      background-color: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
    }

    .progress-fill {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 0%; 
      height: 3px;
      background-color: #ffffff;
      border-radius: 2px;
      pointer-events: none;
    }

    .progress-thumb {
      position: absolute;
      left: 0%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      background-color: #ffffff;
      border-radius: 50%;
      pointer-events: none;
    }

    .time-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 4px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    /* প্লেব্যাক কন্ট্রোলস */
    .playback-controls {
      display: flex;
      align-items: center;
      justify-content: center; 
      padding: 5px 0 10px 0; 
      flex-shrink: 0;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .control-btn {
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      transform: scale(1);
      opacity: 1;
      width: 50px; 
      overflow: hidden; 
    }
    
    .control-btn.prev-btn {
      margin-right: 40px;
    }
    
    .control-btn.next-btn {
      margin-left: 40px;
    }

    .control-btn img {
      width: 30px;  
      height: 30px; 
      object-fit: contain;
      filter: brightness(0) invert(1);
    }

    .skip-wrapper {
      display: flex;
      align-items: center;
    }

    .skip-line {
      width: 3px;      
      height: 22px;      
      background-color: #ffffff;
      border-radius: 2px; 
    }

    .back-icon {
      transform: scaleX(-1);
      margin-left: -2px; 
    }

    .next-icon {
      margin-right: -2px; 
    }

    .play-spacer {
      width: 0px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .play-pause-btn {
      width: 70px;
      height: 70px;
      background-color: #ffffff;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: none;
      flex-shrink: 0;
      transition: transform 0.2s ease, background-color 0.3s ease;
      position: relative;
      z-index: 5;
    }

    .play-pause-btn:active {
      transform: scale(0.92);
    }

    .play-pause-btn svg,
    .play-pause-btn img {
      width: 34px;
      height: 34px;
      fill: #1a1c0d;
      object-fit: contain;
    }

            /* ফুলস্ক্রিন/প্লে অবস্থার স্মুথ অ্যানিমেশন - কোনো বাটন বা কন্ট্রোল অদৃশ্য হবে না */
    .player-container.fullscreen-active .action-buttons,
    .player-container.fullscreen-active .progress-container {
      opacity: 1;
      max-height: 30px;
      margin-bottom: 12px;
      pointer-events: auto;
      overflow: visible;
    }

    .player-container.fullscreen-active .prev-btn,
    .player-container.fullscreen-active .next-btn {
      width: 50px;
      padding: 10px;
      transform: scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    .player-container.fullscreen-active .prev-btn {
      margin-right: 40px;
    }

    .player-container.fullscreen-active .next-btn {
      margin-left: 40px;
    }
    
    .player-container.fullscreen-active .play-spacer {
      width: 0px;
      display: none;
    }

    .player-container.fullscreen-active .playback-controls {
      padding: 5px 0 10px 0;
      justify-content: center;
    }



    @media (max-height: 600px) {
      .nav-header { margin-bottom: 5px; }
      .album-art-container { margin-bottom: 10px; }
      .play-pause-btn { width: 55px; height: 55px; } 
      .play-pause-btn svg,
      .play-pause-btn img { width: 26px; height: 26px; } 
      .control-btn.prev-btn { margin-right: 30px; }
      .control-btn.next-btn { margin-left: 30px; }
    }

    /* T-Popup (Bottom Sheet) Styles */
    .t-popup-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom right, rgba(26, 47, 21, 0.8), rgba(16, 22, 11, 0.8), rgba(0, 0, 0, 0.8));
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .t-popup-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .t-popup-sheet {
      position: absolute;
      bottom: -100%;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 450px;
      background-color: #212121;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      z-index: 101;
      display: flex;
      flex-direction: column;
      max-height: 95%;
      transition: bottom 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      color: #ffffff;
      font-family: 'Roboto', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    .t-popup-sheet.active {
      bottom: 0;
    }

    .t-popup-header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 20px 16px 8px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .t-popup-icon-btn {
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      padding: 4px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 20px;
      transition: background-color 0.2s;
    }

    .t-popup-icon-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .t-popup-icon-filled {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .t-action-row {
      display: flex;
      justify-content: space-evenly;
      padding: 16px 8px;
    }

    .t-action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      width: 100px;
    }

    .t-action-icon-box {
      width: 100%;
      height: 60px;
      background-color: #363636;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
    }

    .t-action-item:hover .t-action-icon-box {
      background-color: #444444;
    }

    .t-action-item span {
      font-size: 13px;
      font-weight: 400;
    }

    .t-list-container {
      display: flex;
      flex-direction: column;
      padding-bottom: 8px;
      overflow-y: auto;
    }

    .t-list-container::-webkit-scrollbar {
      width: 4px;
    }

    .t-list-container::-webkit-scrollbar-thumb {
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .t-list-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .t-list-item:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .t-list-item .material-symbols-outlined {
      margin-right: 18px;
      font-size: 24px;
    }

    .t-list-item span {
      font-size: 15px;
      font-weight: 400;
    }

    /* Video Dialogue Speaker Badge — Modern Clean Glass Pill */
    .speaker-indicator-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 25;
      display: none;
      align-items: center;
      padding: 5px 14px;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.78) 0%, rgba(30, 41, 59, 0.65) 100%);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 9999px;
      box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.5), 
                  0 0 0 1px rgba(255, 255, 255, 0.08) inset;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      transform: translateY(-6px) scale(0.96);
      opacity: 0;
      transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), 
                  transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform, opacity;
    }

    .speaker-indicator-badge.visible {
      display: inline-flex;
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* টেক্সট কন্টেইনার */
    .speaker-badge-content {
      display: flex;
      align-items: baseline;
      gap: 6px;
      line-height: 1;
    }

    .speaker-label-tag {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #94a3b8;
    }

    .speaker-badge-name {
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: #f8fafc;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Top Header - YouTube Mobile Style -->
    <header class="sticky-header">
      <div class="header-top">
        <div class="brand-group">
          <div class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
          </div>
          <div class="header-titles">
            <h1>Madhyamik <span>Bengali</span></h1>
          </div>
        </div>

        <div class="yt-top-actions">
          <button class="yt-icon-btn" id="openSearchBtn" aria-label="Search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- Search & Filters -->
      <div class="control-panel">
        <div class="search-wrapper" id="searchWrapper" style="display: none;">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input 
            type="search" 
            id="searchInput" 
            class="search-input" 
            placeholder="Search chapters or topics..." 
            autocomplete="off"
            aria-label="Search Chapters"
          >
          <button id="clearSearchBtn" class="clear-search-btn" title="Clear search" aria-label="Clear Search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <!-- YouTube Chip Filter Row (With Explore Button) -->
        <div class="filters-scroll-wrapper">
          <button class="explore-btn" aria-label="Explore">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
            </svg>
          </button>
          <div class="filters-divider"></div>
          <div class="filters-scroll" role="tablist" aria-label="Filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="video">Video</button>
            <button class="filter-btn" data-filter="audio">Audio</button>
            <button class="filter-btn" data-filter="cartoon">Cartoon</button>
            <button class="filter-btn" data-filter="realistic">Realistic</button>
            <button class="filter-btn" data-filter="poem">Poem</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content List -->
    <main class="content-area">
      <div class="results-meta">
        <span id="statusIndicator">দেখাচ্ছে ৭ টি অধ্যায়</span>
        <span id="resourceTotalIndicator">মোট ১৫ টি রিসোর্স</span>
      </div>

      <div id="chaptersContainer" aria-live="polite">
        <!-- Rendered via JavaScript -->
      </div>

      <!-- No Results State -->
      <div id="emptyState" class="empty-state" style="display: none;">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
        <h2 class="empty-title">কোনো অধ্যায় বা রিসোর্স পাওয়া যায়নি</h2>
        <p class="empty-desc">অনুগ্রহ করে অন্য শব্দ দিয়ে খুঁজুন অথবা ফিল্টার রিসেট করুন।</p>
        <button id="resetFilterBtn" class="reset-btn">ফিল্টার রিসেট করুন</button>
      </div>
    </main>

    <!-- Interactive Visual Poem Modal Viewer -->
    <div id="poemModal" class="poem-modal-overlay" onclick="closePoemModal(event)">
      <div class="poem-modal-card" onclick="event.stopPropagation()">
        <div class="poem-modal-header">
          <div class="poem-modal-header-info">
            <h3 id="poemModalTitle">কবিতা</h3>
            <p id="poemModalSubtitle"></p>
          </div>
          <button class="poem-modal-close-btn" onclick="closePoemModal()" title="বন্ধ করুন">✕</button>
        </div>

        <div class="poem-scene-wrapper" id="poemSwipeArea">
          <img id="poemSceneImage" class="poem-scene-image" src="" alt="কবিতার দৃশ্য" />
          <button class="poem-nav-btn poem-nav-prev" onclick="prevPoemSlide()" title="পূর্ববর্তী দৃশ্য" aria-label="Previous scene">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <button class="poem-nav-btn poem-nav-next" onclick="nextPoemSlide()" title="পরবর্তী দৃশ্য" aria-label="Next scene">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </div>

        <div class="poem-text-content">
          <p id="poemStanzaText" class="poem-stanza-text"></p>
        </div>

    // YouTube ID Extractor Helper
    function getYoutubeVideoId(url) {
      try {
        const urlObj = new URL(url);
        if (urlObj.hostname.includes('youtu.be')) {
          return urlObj.pathname.slice(1).split('?')[0];
        } else if (urlObj.searchParams.has('v')) {
          return urlObj.searchParams.get('v');
        }
        return '';
      } catch (e) {
        return '';
      }
    }

    // YouTube Start Time Extractor Helper
    function getYoutubeStartTime(url) {
      try {
        const urlObj = new URL(url);
        const t = urlObj.searchParams.get('t') || urlObj.searchParams.get('start');
        return t ? parseInt(t, 10) : 0;
      } catch (e) {
        return 0;
      }
    }

    // YouTube End Time Extractor Helper
    function getYoutubeEndTime(url) {
      try {
        const urlObj = new URL(url);
        const end = urlObj.searchParams.get('end');
        return end ? parseInt(end, 10) : 0;
      } catch (e) {
        return 0;
      }
    }

    // YouTube Thumbnail Generator Helper
    function getYoutubeThumbnailUrl(url) {
      const videoId = getYoutubeVideoId(url);
      return videoId ? `https://img.youtube.com/vi/${videoId}/mqdefault.jpg` : '';
    }

    let currentActiveContainer = null;
    let currentYTPlayer = null;

      tag.src = "https://www.youtube.com/iframe_api";
      const firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    }

    // Helper to format time into M:SS (matching reference music player)
    function formatMediaTime(seconds) {
      if (!seconds || isNaN(seconds) || seconds < 0) seconds = 0;
      const totalSec = Math.floor(seconds);
      const hrs = Math.floor(totalSec / 3600);
      const mins = Math.floor((totalSec % 3600) / 60);
      const secs = totalSec % 60;
      const sStr = secs < 10 ? '0' + secs : String(secs);
      if (hrs > 0) {
        const mStr = mins < 10 ? '0' + mins : String(mins);
        return `${hrs}:${mStr}:${sStr}`;
      }
      return `${mins}:${sStr}`;
    }

    // Function to play video/audio instantly on click with dynamic timeline, seekbar, controls, and Voice Wave logic
    function playInlineVideo(container, videoId, startTime = 0, endTime = 0, skipRanges = [], isAudio = false, dialogues = []) {
      if (!videoId) return;

      // If this video is already playing, do nothing
      if (currentActiveContainer === container) return;

      // Stop previous player instance, clear timers, and restore its thumbnail
      if (currentActiveContainer && currentActiveContainer !== container && currentActiveContainer.isConnected) {
        if (currentActiveContainer._timeCheckTimer) {
          clearInterval(currentActiveContainer._timeCheckTimer);
          currentActiveContainer._timeCheckTimer = null;
        }
        if (currentActiveContainer._autoHideTimelineTimer) {
          clearTimeout(currentActiveContainer._autoHideTimelineTimer);
          currentActiveContainer._autoHideTimelineTimer = null;
        }
        if (currentYTPlayer && typeof currentYTPlayer.destroy === 'function') {
          try { currentYTPlayer.destroy(); } catch (e) {}
          currentYTPlayer = null;
        }
        if (currentActiveContainer._originalThumbHTML) {
          currentActiveContainer.innerHTML = currentActiveContainer._originalThumbHTML;
          if (currentActiveContainer._savedOnClick) {
            currentActiveContainer.setAttribute('onclick', currentActiveContainer._savedOnClick);
          }
        }
      }

      // Save the initial thumbnail UI before inserting player
      if (!container._originalThumbHTML) {
        container._originalThumbHTML = container.innerHTML;
      }
      if (!container._savedOnClick) {
        container._savedOnClick = container.getAttribute('onclick');
      }

      container._savedVideoId = videoId;
      container._isScrubbing = false;
      container._autoHideTimelineTimer = null;
      container._isAudio = isAudio;
      currentActiveContainer = container;

      // Remove click handler from container while playing
      container.removeAttribute('onclick');

            // Create an internal mount element for YouTube Player
      const uniquePlayerId = 'yt_player_' + Math.random().toString(36).substring(2, 9);
      if (isAudio) {
        container.innerHTML = `
          <div id="${uniquePlayerId}" class="audio-hidden-mount"></div>
          ${getAudioPlayerHTML()}
        `;
        const audioWrap = container.querySelector('.audio-player-wrapper');
        if (audioWrap) audioWrap.style.display = 'none';
        initAudioScrubber();
      } else {

        container.innerHTML = `
          <div id="${uniquePlayerId}" style="width:100%;height:100%;"></div>
          <div id="speakerBadge" class="speaker-indicator-badge">
            <div class="speaker-badge-content">
              <span class="speaker-label-tag">চরিত্র:-</span>
              <span id="speakerBadgeText" class="speaker-badge-name"></span>
            </div>
          </div>
        `;
      }

      const playerVarsObj = {
        autoplay: 1,
        playsinline: 1,
        fs: 1,
        rel: 0,
        iv_load_policy: 3,
        modestbranding: 1,
        enablejsapi: 1,
        start: startTime || 0
      };

      if (endTime > 0) {
        playerVarsObj.end = endTime;
      }

      function initAudioScrubber() {
        const playerContainer = document.getElementById('playerContainer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('audioBtnPrev');
        const nextBtn = document.getElementById('audioBtnNext');
        const wrap = document.getElementById('audioProgressWrap');
        const fill = document.getElementById('audioProgressFill');
        const thumb = document.getElementById('audioProgressThumb');
        const timeCur = document.getElementById('audioTimeCurrent');
        const timeDur = document.getElementById('audioTimeDuration');

        const playContent = `<img src="https://raw.githubusercontent.com/yiasersk-design/SVG/main/play-503072-512px.webp" alt="Play">`;
        const pauseContent = `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;

        if (playPauseBtn) {
          playPauseBtn.innerHTML = pauseContent;
        }

        // স্ক্রিন ট্যাপে ফুল/মিনি কন্ট্রোল মোড পরিবর্তন
        if (playerContainer) {
          playerContainer.onclick = function(e) {
            if (e.target.closest('.play-pause-btn') || e.target.closest('.control-btn') || e.target.closest('.nav-btn') || e.target.closest('.progress-bar-wrapper')) {
              return;
            }
            if (playerContainer.classList.contains('fullscreen-active')) {
              playerContainer.classList.remove('fullscreen-active');
            } else if (currentYTPlayer && typeof currentYTPlayer.getPlayerState === 'function' && currentYTPlayer.getPlayerState() === YT.PlayerState.PLAYING) {
              playerContainer.classList.add('fullscreen-active');
            }
          };
        }

        // প্লে ও পজ বাটন ক্লিক হ্যান্ডলার
        if (playPauseBtn) {
          playPauseBtn.onclick = function(e) {
            e.stopPropagation();
            if (!currentYTPlayer || typeof currentYTPlayer.getPlayerState !== 'function') return;
            const state = currentYTPlayer.getPlayerState();
            if (state === YT.PlayerState.PLAYING) {
              currentYTPlayer.pauseVideo();
            } else {
              currentYTPlayer.playVideo();
            }
          };
        }

        // পূর্ববর্তী বাটন (১০ সেকেন্ড পিছিয়ে যাওয়া)
        if (prevBtn) {
          prevBtn.onclick = function(e) {
            e.stopPropagation();
            if (!currentYTPlayer || typeof currentYTPlayer.getCurrentTime !== 'function') return;
            const cur = currentYTPlayer.getCurrentTime();
            const minTime = startTime || 0;
            currentYTPlayer.seekTo(Math.max(minTime, cur - 10), true);
          };
        }

        // পরবর্তী বাটন (১০ সেকেন্ড এগিয়ে যাওয়া)
        if (nextBtn) {
          nextBtn.onclick = function(e) {
            e.stopPropagation();
            if (!currentYTPlayer || typeof currentYTPlayer.getCurrentTime !== 'function') return;
            const cur = currentYTPlayer.getCurrentTime();
            const maxDuration = (endTime > 0 ? endTime : currentYTPlayer.getDuration()) || (cur + 10);
            currentYTPlayer.seekTo(Math.min(maxDuration, cur + 10), true);
          };
        }

        // প্রোগ্রেস বার স্ক্রাবিং লজিক
        if (!wrap || !fill || !thumb) return;
        let isDragging = false;

        function updateFromPointer(e) {
          const rect = wrap.getBoundingClientRect();
          const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
          let ratio = (clientX - rect.left) / rect.width;
          if (ratio < 0) ratio = 0;
          if (ratio > 1) ratio = 1;

          fill.style.width = (ratio * 100) + '%';
          thumb.style.left = (ratio * 100) + '%';

          const curDuration = (endTime > 0 ? endTime : (currentYTPlayer && typeof currentYTPlayer.getDuration === 'function' ? currentYTPlayer.getDuration() : 0)) || 0;
          const segDuration = Math.max(1, curDuration - (startTime || 0));
          const seekTarget = (startTime || 0) + (ratio * segDuration);

          if (timeCur) {
            timeCur.textContent = formatMediaTime(seekTarget);
          }
          return seekTarget;
        }

        wrap.onpointerdown = function(e) {
          e.stopPropagation();
          isDragging = true;
          container._isScrubbing = true;
          try { wrap.setPointerCapture(e.pointerId); } catch (err) {}
          updateFromPointer(e);
        };

        wrap.onpointermove = function(e) {
          if (!isDragging) return;
          updateFromPointer(e);
        };

        wrap.onpointerup = function(e) {
          if (!isDragging) return;
          const seekTarget = updateFromPointer(e);
          isDragging = false;
          container._isScrubbing = false;
          try { wrap.releasePointerCapture(e.pointerId); } catch (err) {}
          if (currentYTPlayer && typeof currentYTPlayer.seekTo === 'function') {
            currentYTPlayer.seekTo(seekTarget, true);
          }
        };

        wrap.onpointercancel = function() {
          isDragging = false;
          container._isScrubbing = false;
        };
      }

      function stopAndClosePlayer() {
        const isFS = document.fullscreenElement || 
                     document.webkitFullscreenElement || 
                     document.mozFullScreenElement || 
                     document.msFullscreenElement;
        if (isFS) {
          const exitFS = document.exitFullscreen || 
                         document.webkitExitFullscreen || 
                         document.mozCancelFullScreen || 
                         document.msExitFullscreen;
          if (exitFS) exitFS.call(document).catch(() => {});
        }
        if (container._timeCheckTimer) {
          clearInterval(container._timeCheckTimer);
          container._timeCheckTimer = null;
        }
        if (container._autoHideTimelineTimer) {
          clearTimeout(container._autoHideTimelineTimer);
          container._autoHideTimelineTimer = null;
        }
        if (currentYTPlayer && typeof currentYTPlayer.destroy === 'function') {
          try { currentYTPlayer.destroy(); } catch (e) {}
          currentYTPlayer = null;
        }
        if (container._originalThumbHTML) {
          container.innerHTML = container._originalThumbHTML;
          if (container._savedOnClick) {
            container.setAttribute('onclick', container._savedOnClick);
          }
        }
        container._stopPlayer = null;
        currentActiveContainer = null;
      }
      container._stopPlayer = stopAndClosePlayer;

      function monitorTimeline() {
        if (!currentYTPlayer || typeof currentYTPlayer.getCurrentTime !== 'function') return;
        const currentTime = currentYTPlayer.getCurrentTime();

        // Check timeline end guard
        if (endTime > 0 && currentTime >= endTime) {
          stopAndClosePlayer();
          return;
        }

        // Check and enforce skip ranges (prevents viewing or seeking into skipped intervals)
        if (Array.isArray(skipRanges) && skipRanges.length > 0) {
          for (let i = 0; i < skipRanges.length; i++) {
            const range = skipRanges[i];
            if (currentTime >= range.start && currentTime < range.end) {
              currentYTPlayer.seekTo(range.end, true);
              break;
            }
          }
        }

        // Update dialogue speaker badge overlay
        if (Array.isArray(dialogues) && dialogues.length > 0) {
          const badge = document.getElementById('speakerBadge');
          const badgeText = document.getElementById('speakerBadgeText');
          if (badge && badgeText) {
            const currentDialogue = dialogues.find(d => currentTime >= d.start && currentTime <= d.end);
            if (currentDialogue) {
              badgeText.textContent = currentDialogue.speaker;
              badge.classList.add('visible');
            } else {
              badge.classList.remove('visible');
            }
          }
        }

        // Update in-app audio timeline UI if not actively scrubbing
        if (isAudio && !container._isScrubbing) {
          const curDuration = (endTime > 0 ? endTime : currentYTPlayer.getDuration()) || 0;
          const segStart = startTime || 0;
          const segDuration = Math.max(1, curDuration - segStart);
          const curSegTime = Math.max(0, currentTime - segStart);
          const pct = Math.min(100, Math.max(0, (curSegTime / segDuration) * 100));

          const fill = document.getElementById('audioProgressFill');
          const thumb = document.getElementById('audioProgressThumb');
          const timeCur = document.getElementById('audioTimeCurrent');
          const timeDur = document.getElementById('audioTimeDuration');

          if (fill) fill.style.width = pct + '%';
          if (thumb) thumb.style.left = pct + '%';
          if (timeCur) timeCur.textContent = formatMediaTime(currentTime);
          if (timeDur) timeDur.textContent = formatMediaTime(curDuration);
        }
      }

      function requestFullScreenMode(element) {
        if (!element) return;
        const requestFS = element.requestFullscreen || 
                          element.webkitRequestFullscreen || 
                          element.mozRequestFullScreen || 
                          element.msRequestFullscreen;
        if (requestFS) {
          const promise = requestFS.call(element);
          if (promise && typeof promise.then === 'function') {
            promise.then(() => {
              history.pushState({ isFullscreenVideo: true }, '');
            }).catch(() => {});
          } else {
            history.pushState({ isFullscreenVideo: true }, '');
          }
        }
      }

      function launchAppropriateFullscreen() {
        const hasOverlay = isAudio || (Array.isArray(dialogues) && dialogues.length > 0);
        const targetElement = hasOverlay ? container : document.getElementById(uniquePlayerId);
        if (targetElement && !document.fullscreenElement && !document.webkitFullscreenElement) {
          requestFullScreenMode(targetElement);
        }
      }

            function createPlayer() {
        currentYTPlayer = new YT.Player(uniquePlayerId, {
          width: '100%',
          height: '100%',
          videoId: videoId,
          playerVars: playerVarsObj,
          events: {
            onReady: function(event) {
              if (startTime > 0) {
                event.target.seekTo(startTime, true);
              }
              event.target.playVideo();
              if (!isAudio) {
                launchAppropriateFullscreen();
              }
            },
            onStateChange: function(event) {
              const playPauseBtn = document.getElementById('playPauseBtn');
              const playerContainer = document.getElementById('playerContainer');
              const playContent = `<img src="https://raw.githubusercontent.com/yiasersk-design/SVG/main/play-503072-512px.webp" alt="Play">`;
              const pauseContent = `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;

              if (event.data === YT.PlayerState.PLAYING) {
                if (isAudio) {
                  const audioWrap = container.querySelector('.audio-player-wrapper');
                  if (audioWrap) audioWrap.style.display = 'flex';
                }
                if (playPauseBtn) playPauseBtn.innerHTML = pauseContent;
                if (playerContainer) playerContainer.classList.add('fullscreen-active');

                launchAppropriateFullscreen();
                if (!container._timeCheckTimer) {
                  container._timeCheckTimer = setInterval(monitorTimeline, 100);
                }
              } else if (event.data === YT.PlayerState.PAUSED) {
                if (playPauseBtn) playPauseBtn.innerHTML = playContent;
                if (playerContainer) playerContainer.classList.remove('fullscreen-active');

                monitorTimeline();
              } else if (event.data === YT.PlayerState.ENDED) {
                stopAndClosePlayer();
              }
            }
          }
        });
      }


      if (window.YT && window.YT.Player) {
        createPlayer();
      } else {
        const checkYTReady = setInterval(() => {
          if (window.YT && window.YT.Player) {
            clearInterval(checkYTReady);
            createPlayer();
          }
        }, 50);
      }
    }

    // সম্পূর্ণ প্লেয়ার বন্ধ করে সরাসরি মেইন পেজে ফিরিয়ে আনার মূল ফাংশন
    function closeActiveVideoPlayer() {
      const isFS = document.fullscreenElement || 
                   document.webkitFullscreenElement || 
                   document.mozFullScreenElement || 
                   document.msFullscreenElement;
      if (isFS) {
        const exitFS = document.exitFullscreen || 
                       document.webkitExitFullscreen || 
                       document.mozCancelFullScreen || 
                       document.msExitFullscreen;
        if (exitFS) {
          try { exitFS.call(document); } catch (e) {}
        }
      }

      if (screen.orientation && screen.orientation.unlock) {
        try { screen.orientation.unlock(); } catch (e) {}
      }

      if (currentActiveContainer) {
        if (currentActiveContainer._timeCheckTimer) {
          clearInterval(currentActiveContainer._timeCheckTimer);
          currentActiveContainer._timeCheckTimer = null;
        }
        if (currentYTPlayer && typeof currentYTPlayer.destroy === 'function') {
          try { currentYTPlayer.destroy(); } catch (e) {}
          currentYTPlayer = null;
        }
        if (currentActiveContainer._originalThumbHTML) {
          currentActiveContainer.innerHTML = currentActiveContainer._originalThumbHTML;
          if (currentActiveContainer._savedOnClick) {
            currentActiveContainer.setAttribute('onclick', currentActiveContainer._savedOnClick);
          }
        }
        currentActiveContainer._stopPlayer = null;
        currentActiveContainer = null;
      }
    }

    // ফুলস্ক্রিন ও অরিয়েন্টেশন নিয়ন্ত্রণ
    function handleFullscreenOrientation() {
      const isFullscreen = document.fullscreenElement || 
                           document.webkitFullscreenElement || 
                           document.mozFullScreenElement || 
                           document.msFullscreenElement;

      if (isFullscreen) {
        if (screen.orientation && screen.orientation.lock) {
          if (currentActiveContainer && currentActiveContainer._isAudio) {
            screen.orientation.lock('portrait').catch(() => {});
          } else {
            screen.orientation.lock('landscape').catch(() => {});
          }
        }
      } else {
        closeActiveVideoPlayer();
        if (history.state && history.state.isFullscreenVideo) {
          history.back();
        }
      }
    }

    // স্ক্রিন ভার্টিক্যাল (Portrait) হওয়া মাত্রই সাথে সাথে ভিডিও বন্ধ করে মেইন পেজে যাওয়ার লিসেনার
    function checkPortraitAndClose() {
      if (!currentActiveContainer || currentActiveContainer._isAudio) return;
      const isPortrait = window.matchMedia("(orientation: portrait)").matches || 
                         (screen.orientation && screen.orientation.type && screen.orientation.type.startsWith('portrait'));
      if (isPortrait) {
        closeActiveVideoPlayer();
      }
    }

    window.addEventListener('orientationchange', () => {
      setTimeout(checkPortraitAndClose, 50);
    });

    if (screen.orientation && screen.orientation.addEventListener) {
      screen.orientation.addEventListener('change', checkPortraitAndClose);
    }

    // ফুলস্ক্রিন পরিবর্তন লিসেনার
    document.addEventListener('fullscreenchange', handleFullscreenOrientation);
    document.addEventListener('webkitfullscreenchange', handleFullscreenOrientation);
    document.addEventListener('mozfullscreenchange', handleFullscreenOrientation);
    document.addEventListener('MSFullscreenChange', handleFullscreenOrientation);

    // মোবাইলের ব্যাক বাটন / ব্যাক সোয়াইপ চাপলে সরাসরি মেইন পেজে ফিরে আসার হ্যান্ডলার
    window.addEventListener('popstate', () => {
      closeActiveVideoPlayer();
    });

    // SVG Icon Generator Helper
    function getResourceIconSvg(type) {

      switch (type) {
        case 'audio':
          return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18v-6a9 9 0 0 1 18 0v6"></path><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path></svg>`;
        case 'cartoon':
          return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z"></path><path d="M9 10h.01"></path><path d="M15 10h.01"></path><path d="M9.5 15a3.5 3.5 0 0 0 5 0"></path></svg>`;
        case 'realistic':
          return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg>`;
        case 'totopia':
          return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>`;
        case 'video':
        default:
          return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>`;
      }
    }

    function getActionIconSvg(action) {
      if (action === "Listen") {
        return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>`;
      }
      return `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>`;
    }

    // Bangla Number Formatter Helper
    function toBengaliNumeral(num) {
      const bnDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
      return String(num).replace(/[0-9]/g, (d) => bnDigits[d]);
    }

    // App State
    let currentFilter = 'all';
    let searchQuery = '';

    // DOM Elements
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const filterButtons = document.querySelectorAll('.filter-btn');
    const chaptersContainer = document.getElementById('chaptersContainer');
    const emptyState = document.getElementById('emptyState');
    const resetFilterBtn = document.getElementById('resetFilterBtn');
    const statusIndicator = document.getElementById('statusIndicator');
    const resourceTotalIndicator = document.getElementById('resourceTotalIndicator');

    // Render Cards - 1 Master Card Per Chapter with In-Thumbnail Options Selector
    function renderApp() {
      const query = searchQuery.trim().toLowerCase();
      let visibleChaptersCount = 0;
      let totalVisibleResources = 0;

      chaptersContainer.innerHTML = '';

      const matchedChapters = [];

      chaptersData.forEach((chapter, chapterIndex) => {
        const matchesQuery = !query || 
          chapter.title.toLowerCase().includes(query) || 
          String(chapter.number).includes(query) ||
          chapter.resources.some(res => res.label.toLowerCase().includes(query));

        const matchedResources = chapter.resources.filter(res => {
          return currentFilter === 'all' || res.type === currentFilter;
        });

        if (matchesQuery && matchedResources.length > 0) {
          matchedChapters.push({
            chapter,
            chapterIndex,
            resources: matchedResources
          });
          totalVisibleResources += matchedResources.length;
        }
      });

      if (matchedChapters.length === 0) {
        chaptersContainer.style.display = 'none';
        emptyState.style.display = 'block';
        statusIndicator.textContent = '০ টি অধ্যায়';
        resourceTotalIndicator.textContent = '';
        return;
      }

      chaptersContainer.style.display = 'flex';
      chaptersContainer.style.flexDirection = 'column';
      chaptersContainer.style.gap = '12px';
      emptyState.style.display = 'none';

      matchedChapters.forEach(({ chapter, chapterIndex, resources }) => {
        visibleChaptersCount++;
        const card = document.createElement('article');
        card.className = 'yt-video-card';

        const initialChar = chapter.title.charAt(0);
        const resourceCountText = `${toBengaliNumeral(resources.length)} টি সংস্করণ`;

        // কনটেন্টের প্রকৃত ধরন অনুযায়ী সঠিক ইংরেজি লেবেল নির্ধারণ
        const hasAudio = resources.some(r => r.type === 'audio' || r.action === 'Listen');
        const hasVideo = resources.some(r => r.type === 'video' || r.type === 'cartoon' || r.type === 'realistic' || r.action === 'Watch');
        const hasImage = resources.some(r => r.type === 'poem' || (r.scenes && r.scenes.length > 0));

        let contentLabel = 'Src: Video';
        if (hasAudio && hasVideo) {
          contentLabel = 'Src: A/V';
        } else if (hasVideo) {
          contentLabel = 'Src: Video';
        } else if (hasAudio) {
          contentLabel = 'Src: Audio';
        } else if (hasImage) {
          contentLabel = 'Src: Image';
        }

        card.innerHTML = `
          <div 
            class="resource-thumb-wrap" 
            role="button" 
            tabindex="0"
            aria-label="${chapter.title} বিকল্পগুলি দেখুন"
            onclick="openChapterOptions(this, ${chapterIndex})"
          >
            <div class="thumb-white-card">
              <span class="thumb-card-tag">অধ্যায় ${toBengaliNumeral(chapter.number)} • ${resourceCountText}</span>
              <h3 class="thumb-card-title">${chapter.title}</h3>
              <p class="thumb-card-subtitle">মাধ্যমিক বাংলা সাহিত্য • ক্লিক করে সংস্করণ বাছুন</p>
              <div class="thumb-card-play" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <polygon points="6 3 20 12 6 21 6 3"></polygon>
                </svg>
              </div>
            </div>
            <div class="yt-duration-badge">
              ${contentLabel}
            </div>
          </div>

          <div class="yt-video-info-row">
            <div class="yt-channel-avatar">
              ${initialChar}
            </div>
            <div class="yt-video-text">
              <h2 
                class="yt-video-title" 
                style="cursor: pointer;"
                onclick="const wrap = this.closest('.yt-video-card').querySelector('.resource-thumb-wrap'); openChapterOptions(wrap, ${chapterIndex});"
              >
                ${chapter.title} (অধ্যায় ${toBengaliNumeral(chapter.number)})
              </h2>
              <div class="yt-video-meta">
                Class 10 Bengali • Madhyamik Prep • ${resourceCountText} উপলব্ধ
              </div>
            </div>
            <button class="yt-more-btn" aria-label="More options" onclick="event.stopPropagation();">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <circle cx="12" cy="5" r="2"></circle>
                <circle cx="12" cy="12" r="2"></circle>
                <circle cx="12" cy="19" r="2"></circle>
              </svg>
            </button>
          </div>
        `;

        chaptersContainer.appendChild(card);
      });

      statusIndicator.textContent = `দেখাচ্ছে ${toBengaliNumeral(visibleChaptersCount)} টি অধ্যায়`;
      resourceTotalIndicator.textContent = `মোট ${toBengaliNumeral(totalVisibleResources)} টি রিসোর্স`;
    }

    // YouTube Mobile Search Bar Toggle
    const openSearchBtn = document.getElementById('openSearchBtn');
    const searchWrapper = document.getElementById('searchWrapper');

    if (openSearchBtn && searchWrapper) {
      openSearchBtn.addEventListener('click', () => {
        const isHidden = searchWrapper.style.display === 'none';
        searchWrapper.style.display = isHidden ? 'flex' : 'none';
        if (isHidden) {
          searchInput.focus();
        }
      });
    }

    // Search Handlers
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      clearSearchBtn.style.display = searchQuery.length > 0 ? 'flex' : 'none';
      renderApp();
    });

    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      clearSearchBtn.style.display = 'none';
      searchInput.focus();
      renderApp();
    });

    // Filter Buttons Handlers
    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderApp();
      });
    });

    // Reset All Filters
    resetFilterBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      clearSearchBtn.style.display = 'none';
      currentFilter = 'all';
      filterButtons.forEach(b => {
        b.classList.toggle('active', b.dataset.filter === 'all');
      });
      renderApp();
    });

    // Poem Modal State & Handlers
    let currentPoemScenes = [];
    let currentPoemSlideIndex = 0;

    function openPoemModal(chapterIndex) {
      const chapter = chaptersData[chapterIndex];
      if (!chapter) return;
      const poemResource = chapter.resources.find(r => r.type === 'poem' && r.scenes);
      if (!poemResource) return;

      currentPoemScenes = poemResource.scenes;
      currentPoemSlideIndex = 0;

      const authorText = chapter.author ? ` — ${chapter.author}` : '';
      document.getElementById('poemModalTitle').textContent = `${chapter.title}${authorText}`;
      const subtitleElem = document.getElementById('poemModalSubtitle');
      if (subtitleElem) {
        subtitleElem.textContent = chapter.subtitle || '';
      }
      updatePoemSlide();

      const modal = document.getElementById('poemModal');
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closePoemModal(event) {
      if (event && event.target && event.target.id !== 'poemModal' && !event.target.classList.contains('poem-modal-close-btn')) {
        return;
      }
      const modal = document.getElementById('poemModal');
      modal.classList.remove('active');
      document.body.style.overflow = '';
    }

    function updatePoemSlide() {
      if (currentPoemScenes.length === 0) return;
      const scene = currentPoemScenes[currentPoemSlideIndex];
      const imgElem = document.getElementById('poemSceneImage');
      const textElem = document.getElementById('poemStanzaText');
      const counterElem = document.getElementById('poemSlideCounter');

      imgElem.src = scene.img;
      textElem.textContent = scene.text;
      counterElem.textContent = `দৃশ্য ${toBengaliNumeral(currentPoemSlideIndex + 1)} / ${toBengaliNumeral(currentPoemScenes.length)}`;
    }

    function nextPoemSlide() {
      if (currentPoemSlideIndex < currentPoemScenes.length - 1) {
        currentPoemSlideIndex++;
      } else {
        currentPoemSlideIndex = 0; // Loop back to start
      }
      updatePoemSlide();
    }

    function prevPoemSlide() {
      if (currentPoemSlideIndex > 0) {
        currentPoemSlideIndex--;
      } else {
        currentPoemSlideIndex = currentPoemScenes.length - 1; // Loop to end
      }
      updatePoemSlide();
    }

    // Touch Swipe (Left / Right swipe support on mobile)
    let touchStartX = 0;
    let touchEndX = 0;

    const swipeArea = document.getElementById('poemSwipeArea');
    if (swipeArea) {
      swipeArea.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      swipeArea.addEventListener('touchend', e => {
        touchEndX = e.changedTouches[0].screenX;
        handlePoemSwipe();
      }, { passive: true });
    }

    function handlePoemSwipe() {
      const swipeDistance = touchEndX - touchStartX;
      if (Math.abs(swipeDistance) > 40) {
        if (swipeDistance < 0) {
          nextPoemSlide(); // Swiped left -> show next
        } else {
          prevPoemSlide(); // Swiped right -> show prev
        }
      }
    }

    // Initial Render
    renderApp();
  </script>
</body>
</html>
